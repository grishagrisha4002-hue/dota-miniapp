<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dota Draft Helper</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080c; color: #8b91a1;
    font: 14px -apple-system, "Segoe UI", Roboto, sans-serif; }
  .msg { display: flex; flex-direction: column; gap: 12px; height: 100%; align-items: center; justify-content: center;
    text-align: center; padding: 20px; box-sizing: border-box; }
  .msg::before { content: ""; width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(233,185,73,.18);
    border-top-color: #e9b949; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="msg" id="msg">Загружаю…</div>
<script>
/*
  Загрузчик. Этот файл не меняется, само приложение лежит в app.html.
  GitHub Pages разрешает браузеру хранить страницы 10 минут, а Telegram держит их
  ещё дольше, поэтому после обновления показывалась старая версия. Здесь app.html
  каждый раз скачивается заново в обход кэша.
*/
(async function () {
  const url = "app.html";
  let html = null;
  for (const opts of [{ cache: "no-store" }, {}]) {          // без интернета — хоть из кэша
    try {
      const r = await fetch(url + (opts.cache ? "?v=" + Date.now() : ""), opts);
      if (r.ok) { html = await r.text(); break; }
    } catch (e) {}
  }
  if (!html) {
    document.getElementById("msg").textContent = "Не удалось загрузить приложение. Проверь интернет и открой заново.";
    return;
  }
  // адрес страницы (и данные Telegram в нём) не меняется — приложение работает как обычно
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
