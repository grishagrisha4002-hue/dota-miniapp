<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dota Draft Helper</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17191d);
    --bg2: var(--tg-theme-secondary-bg-color, #0f1013);
    --card: var(--tg-theme-section-bg-color, #22252b);
    --text: var(--tg-theme-text-color, #f1f2f4);
    --hint: var(--tg-theme-hint-color, #8b9099);
    --accent: var(--tg-theme-button-color, #c23c2a);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --good: #3fb76b;
    --bad: #e0574a;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  input { font: inherit; }

  /* ---- нижняя навигация ---- */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
    background: var(--bg); border-top: 1px solid rgba(127,127,127,.15);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabs button { flex: 1; padding: 6px 0; border-radius: 10px; color: var(--hint);
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; }
  nav.tabs button .ico { font-size: 20px; line-height: 1; }
  nav.tabs button.active { color: var(--accent); }

  .view { display: none; padding: 12px; }
  .view.active { display: block; }
  h1 { font-size: 22px; margin: 4px 2px 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--hint);
    margin: 18px 2px 8px; font-weight: 600; }
  .muted { color: var(--hint); font-size: 13px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 12px; }

  /* ---- поиск и фильтры ---- */
  .search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 0; outline: 0;
    background: var(--card); color: var(--text); margin-bottom: 10px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px;
    scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; padding: 6px 12px; border-radius: 999px; background: var(--card);
    font-size: 13px; color: var(--text); }
  .chip.active { background: var(--accent); color: var(--accent-text); }

  /* ---- сетка героев ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .hero-tile { background: var(--card); border-radius: 10px; overflow: hidden; text-align: left; }
  .hero-tile img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
  .hero-tile .nm { font-size: 12px; padding: 5px 6px 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .hero-tile .wr { font-size: 11px; padding: 0 6px 6px; }
  .good { color: var(--good); } .bad { color: var(--bad); }

  /* ---- карточка героя ---- */
  .hero-head { position: relative; border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
  .hero-head img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .hero-head .over { position: absolute; inset: auto 0 0 0; padding: 30px 12px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); color: #fff; }
  .hero-head .over .t { font-size: 22px; font-weight: 700; }
  .hero-head .over .s { font-size: 12px; opacity: .8; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat .v { font-size: 20px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--hint); }
  .items { display: flex; flex-wrap: wrap; gap: 8px; }
  .item { width: 58px; text-align: center; font-size: 11px; color: var(--hint); }
  .item img { width: 58px; height: 42px; border-radius: 6px; object-fit: cover; display: block;
    background: #000; margin-bottom: 2px; }
  .build .st { font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  .build .st:first-child { margin-top: 0; }
  .build .var { padding: 6px 0 8px; border-bottom: 1px dashed rgba(127,127,127,.15); }
  .build .var:last-of-type { border-bottom: 0; }
  .build .vl { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .build .vl span { font-weight: 400; color: var(--hint); }
  .build .item .ic { position: relative; display: block; }
  .build .item .cnt { position: absolute; right: 2px; bottom: 2px; background: rgba(0,0,0,.75); color: #fff;
    font-size: 10px; padding: 0 3px; border-radius: 4px; }
  .build .item .sub { display: block; font-size: 10px; color: var(--good); margin-top: 1px; }
  .build .why, .ctr .why { font-size: 12px; color: var(--hint); margin-top: 4px; }
  .ctr { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0;
    border-bottom: 1px solid rgba(127,127,127,.12); }
  .ctr:last-child { border-bottom: 0; }
  .ctr img { width: 50px; height: 36px; border-radius: 6px; object-fit: cover; background: #000; flex-shrink: 0; }
  .ctr .why { margin-top: 2px; }
  .bal { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid rgba(127,127,127,.12); }
  .bal:last-of-type { border-bottom: 0; }
  .bal img { width: 50px; height: 36px; border-radius: 6px; object-fit: cover; background: #000; flex-shrink: 0; }
  .bal .bt { min-width: 0; }
  .bal .tm { font-size: 12px; color: var(--hint); font-weight: 400; }
  .bal .tag { font-size: 12px; margin-top: 2px; line-height: 1.3; }
  .bal .tp { color: var(--hint); }
  .bal .tc { color: var(--bad); }
  .bal .ti { color: var(--text); opacity: .75; }
  .bal .tidle { color: var(--hint); font-style: italic; }
  .build .legend { margin-top: 10px; font-size: 11px; }
  /* ---- значки на иконках предметов и карточка предмета ---- */
  .item[data-k], .bal[data-k] { cursor: pointer; }
  .item .ic { position: relative; display: block; }
  .ibadge { position: absolute; left: 2px; top: 2px; font-style: normal; font-size: 11px; line-height: 1;
    background: rgba(0,0,0,.7); border-radius: 4px; padding: 1px 2px; }
  #item-card { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); display: none;
    align-items: flex-end; justify-content: center; }
  #item-card.open { display: flex; }
  #item-card .sheet { position: relative; width: 100%; max-width: 520px; background: var(--bg2);
    border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); font-size: 14px; line-height: 1.45; }
  #item-card .ic-close { position: absolute; right: 12px; top: 10px; font-size: 18px; color: var(--hint); }
  .ic-head { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; }
  .ic-head img { width: 64px; height: 46px; border-radius: 8px; object-fit: cover; background: #000; }
  .ic-head b { font-size: 17px; }
  .ic-what { margin-bottom: 8px; }
  .ic-need { color: var(--bad); font-weight: 600; }
  .ic-idle { color: var(--hint); }
  .ic-core { color: var(--good); }
  .ic-into { margin-top: 8px; color: var(--hint); }
  .guide-btn { display: block; width: 100%; margin: 0 0 4px; padding: 11px 12px; border-radius: 12px;
    background: var(--card); text-align: left; font-weight: 600; font-size: 14px;
    border: 1px solid rgba(127,127,127,.25); }
  .guide-btn span { font-weight: 400; color: var(--hint); font-size: 12px; }
  .guide-btn:active { transform: scale(.98); }
  details.alt { margin-top: 10px; }
  details.alt > .build { margin-top: 8px; }
  details.pro-items { margin-top: 18px; }
  details.pro-items summary { cursor: pointer; padding: 12px; border-radius: var(--radius); background: var(--card);
    font-weight: 600; font-size: 14px; list-style: none; }
  details.pro-items summary::-webkit-details-marker { display: none; }
  details.pro-items summary::after { content: " ▾"; color: var(--hint); }
  details.pro-items[open] summary::after { content: " ▴"; }
  .mu { display: flex; flex-direction: column; gap: 6px; }
  .mu-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; }
  .mu-row img { width: 48px; height: 27px; border-radius: 4px; object-fit: cover; background: #000; }
  .mu-row .nm { flex: 1; }
  .mu-row .val { font-weight: 600; font-size: 14px; }
  .mu-row .g { font-size: 11px; color: var(--hint); width: 44px; text-align: right; }

  .match-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 0;
    border-bottom: 1px solid rgba(127,127,127,.12); }
  .match-row:last-child { border-bottom: 0; }
  .match-row .res { width: 82px; font-weight: 600; font-size: 13px; }
  .match-row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 13px; }
  .match-row .mid span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match-row .mid .muted { font-size: 11px; }
  .match-row .kda { font-weight: 600; font-size: 13px; }

  /* ---- топ ---- */
  .top-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; width: 100%; text-align: left;
    border-bottom: 1px solid rgba(127,127,127,.12); }
  .top-row:last-child { border-bottom: 0; }
  .top-row .rk { width: 22px; color: var(--hint); font-size: 13px; text-align: right; }
  .top-row img { width: 56px; height: 32px; border-radius: 5px; object-fit: cover; background: #000; }
  .top-row .mid { flex: 1; min-width: 0; }
  .bar { height: 4px; border-radius: 2px; background: rgba(127,127,127,.2); margin-top: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good); }

  /* ---- драфт ---- */
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .slot { aspect-ratio: 16/11; border-radius: 8px; background: var(--card); position: relative;
    overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 22px;
    color: var(--hint); border: 2px dashed rgba(127,127,127,.3); }
  .slot.filled { border: 2px solid transparent; }
  .slot.ally.filled { border-color: var(--good); }
  .slot.enemy.filled { border-color: var(--bad); }
  .add-ally { display: block; width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px;
    border: 2px dashed var(--good); color: var(--good); font-size: 15px; font-weight: 600;
    background: rgba(63,183,107,.08); text-align: center; transition: transform .1s, background .15s; }
  .add-ally:active { transform: scale(.98); background: rgba(63,183,107,.18); }
  .add-ally .pl { font-size: 20px; font-weight: 700; line-height: 1; vertical-align: -2px; margin-right: 4px; }
  .add-ally[hidden] { display: none; }
  .add-enemy { border-color: var(--bad); color: var(--bad); background: rgba(224,87,74,.08); }
  .add-enemy:active { background: rgba(224,87,74,.18); }
  #picker-pos-wrap[hidden] { display: none; }
  #picker-pos-wrap .lbl { font-size: 12px; color: var(--hint); margin-bottom: 6px; }
  .slot.me { border-style: solid; border-color: var(--good); background: rgba(127,127,127,.12); }
  .slot.empty, .slot.me { flex-direction: column; gap: 1px; line-height: 1.1; text-align: center; }
  .slot .num { font-size: 16px; font-weight: 700; color: var(--hint); }
  .slot.me .num { color: var(--text); font-size: 13px; }
  .slot .role { font-size: 10px; color: var(--hint); white-space: nowrap; }
  .slot.filled .role { position: absolute; left: 0; right: 0; bottom: 0; padding: 1px 0;
    background: rgba(0,0,0,.6); color: #fff; font-size: 9px; text-align: center; }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slot .x { position: absolute; top: 2px; right: 3px; font-size: 11px; background: rgba(0,0,0,.6);
    color: #fff; border-radius: 50%; width: 16px; height: 16px; line-height: 16px; text-align: center; }
  .rec { display: flex; gap: 10px; align-items: center; padding: 10px 0; width: 100%; text-align: left;
    border-bottom: 1px solid rgba(127,127,127,.12); }
  .rec:last-child { border-bottom: 0; }
  .rec img { width: 72px; height: 40px; border-radius: 6px; object-fit: cover; background: #000; }
  .rec .mid { flex: 1; min-width: 0; }
  .rec .nm { font-weight: 600; }
  .rec .det { font-size: 12px; color: var(--hint); }
  .rec .sc { font-weight: 700; font-size: 16px; }
  .rec .risk { font-size: 12px; margin-top: 2px; }
  .rec .badge { font-size: 10px; font-weight: 600; color: var(--good); border: 1px solid var(--good);
    border-radius: 6px; padding: 0 4px; vertical-align: 2px; white-space: nowrap; }
  .phase { font-size: 13px; line-height: 1.4; background: rgba(127,127,127,.1); border-radius: 10px;
    padding: 8px 10px; margin-bottom: 4px; }
  .warn { background: rgba(224,87,74,.12); color: var(--text); border-radius: 10px; padding: 10px 12px;
    font-size: 13px; margin-top: 10px; }
  .draft-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .draft-head h1 { margin-right: 0; }
  .reset-btn { flex-shrink: 0; padding: 8px 12px; border-radius: 10px; background: var(--card);
    font-size: 13px; color: var(--text); margin-bottom: 8px; }
  .reset-btn:active { transform: scale(.96); }
  .btn { display: block; width: 100%; padding: 12px; border-radius: 10px; background: var(--card);
    text-align: center; margin-top: 10px; }

  /* ---- выбор героя (оверлей) ---- */
  #picker { position: fixed; inset: 0; z-index: 30; background: var(--bg2); display: none;
    flex-direction: column; }
  #picker.open { display: flex; }
  #picker .top { padding: 12px 12px 0; background: var(--bg2); }
  #picker .top .ttl { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #picker .top .ttl b { font-size: 18px; }
  #picker .body { flex: 1; overflow-y: auto; padding: 0 12px 20px; }

  .loading { padding: 40px 0; text-align: center; color: var(--hint); }
  .error { padding: 20px; text-align: center; color: var(--bad); }
</style>
</head>
<body>

<section class="view active" id="view-draft">
  <div class="draft-head"><h1>🧠 Помощник драфта</h1>
    <button class="reset-btn" id="draft-reset">🗑 Сбросить</button></div>
  <h2>🟢 Твоя команда</h2>
  <div class="slots" id="ally-slots"></div>
  <p class="muted" style="margin:6px 0 0;font-size:12px">Нажми на позицию, чтобы встать на неё.</p>
  <button class="add-ally" id="add-ally"><span class="pl">+</span> Добавить союзника</button>
  <h2>🔴 Враги</h2>
  <div class="slots" id="enemy-slots"></div>
  <button class="add-ally add-enemy" id="add-enemy"><span class="pl">+</span> Добавить врага</button>
  <h2 id="recs-title">✅ Советую взять</h2>
  <div class="card" id="recs"><div class="loading">Загружаю данные…</div></div>
</section>

<section class="view" id="view-heroes">
  <h1>🦸 Герои</h1>
  <input class="search" id="hero-search" placeholder="Поиск героя…" autocomplete="off">
  <div class="chips" id="hero-attrs"></div>
  <div class="chips" id="hero-sort"></div>
  <div class="grid" id="hero-grid"><div class="loading">Загружаю героев…</div></div>
</section>

<section class="view" id="view-top">
  <h1>🏆 Топ винрейтов</h1>
  <div class="chips" id="top-mode"></div>
  <div class="card" id="top-list"><div class="loading">Загружаю…</div></div>
  <p class="muted" id="top-note"></p>
</section>

<section class="view" id="view-hero"></section>

<div id="item-card"><div class="sheet">
  <button class="ic-close" onclick="closeItemCard()">✕</button>
  <div id="item-card-body"></div>
</div></div>

<div id="picker">
  <div class="top">
    <div class="ttl"><b id="picker-title">Выбери героя</b><button id="picker-close">✕</button></div>
    <div id="picker-pos-wrap" hidden><div class="lbl">На какую позицию:</div><div class="chips" id="picker-pos"></div></div>
    <input class="search" id="picker-search" placeholder="Поиск героя…" autocomplete="off">
    <div class="chips" id="picker-attrs"></div>
  </div>
  <div class="body"><div class="grid" id="picker-grid"></div></div>
</div>

<nav class="tabs">
  <button data-tab="draft" class="active"><span class="ico">🧠</span>Драфт</button>
  <button data-tab="heroes"><span class="ico">🦸</span>Герои</button>
  <button data-tab="top"><span class="ico">🏆</span>Топ</button>
</nav>

<script>

  // 4 Семи-сап
  ["Ancient Apparition", "Bane", "Batrider", "Bounty Hunter", "Chen", "Clockwerk", "Dark Willow", "Disruptor",
   "Earth Spirit", "Earthshaker", "Elder Titan", "Enchantress", "Grimstroke", "Hoodwink", "Jakiro", "Keeper of the Light",

const mem = {};
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

async function api(path, ttl) {
  const now = Date.now();
  const hit = mem[path] || lsGet("od:" + path);
  if (hit && now - hit.t < ttl) return (mem[path] = hit).data;
  try {
    const r = await fetch(API + path);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    mem[path] = { t: now, data };
    lsSet("od:" + path, mem[path]);
    return data;
  } catch (err) {
    if (hit) return hit.data;            // нет сети — отдадим старые данные
    throw err;
  }
}

// Explorer считает это ~3 с; ограничиваем последними матчами по match_id, иначе запрос не успевает.
const SYNERGY_TTL = 24 * 3600e3;
const synergy = id => api("/explorer?sql=" + encodeURIComponent(
  `SELECT pm2.hero_id, count(*) games, sum(((pm1.player_slot < 128) = m.radiant_win)::int) wins
   FROM matches m
   JOIN player_matches pm1 ON pm1.match_id = m.match_id AND pm1.hero_id = ${+id}
   JOIN player_matches pm2 ON pm2.match_id = m.match_id AND (pm2.player_slot < 128) = (pm1.player_slot < 128) AND pm2.hero_id <> ${+id}
   WHERE m.match_id > (SELECT max(match_id) - 400000000 FROM matches)
   GROUP BY pm2.hero_id`), SYNERGY_TTL).then(d => {
  if (!d || d.err || !d.rows) throw new Error(d && d.err || "нет данных");
  return d.rows;
});

/* ================================================================ утилиты */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Math.round(n).toLocaleString("ru-RU");
const sign = x => (x >= 0 ? "+" : "") + x.toFixed(1);
const heroImg = h => h && h.img ? CDN + h.img : "";
const wrClass = w => w == null ? "" : w >= 52 ? "good" : w <= 48 ? "bad" : "";
function pub(h, brackets = [1, 2, 3, 4, 5, 6, 7, 8]) {
  let p = 0, w = 0;
  for (const b of brackets) { p += h[b + "_pick"] || 0; w += h[b + "_win"] || 0; }
  return { p, w, wr: p ? w / p * 100 : null };
}
const proStat = h => ({ p: h.pro_pick || 0, w: h.pro_win || 0, wr: h.pro_pick ? h.pro_win / h.pro_pick * 100 : null });
const norm = s => s.toLowerCase().replace(/[^a-z0-9а-яё]/g, "");

function tileHTML(h, extra = "") {
  const hi = pub(h, HIGH).wr;
  return `<button class="hero-tile" data-id="${h.id}">
    <img loading="lazy" src="${heroImg(h)}" alt="">
    <div class="nm">${esc(h.localized_name)}</div>
    <div class="wr ${wrClass(hi)}">${hi == null ? "—" : hi.toFixed(1) + "%"}${extra}</div>
  </button>`;
}
function chipsHTML(opts, active) {
  return opts.map(([v, t]) => `<button class="chip ${v === active ? "active" : ""}" data-v="${v}">${t}</button>`).join("");
}

  if (!tg) return;

}

  if ($("#picker").classList.contains("open")) return closePicker();

}

// Нужен ли ситуативный предмет в этом драфте и почему — для новичков
function itemDraftNote(key, enemies) {
  const g = ITEM_GUIDE[key];
  if (!g) return null;
  if (!g.tags || !g.tags.length) return { what: g.what, need: [], idle: "", core: true, start: !!g.start };   // основной / стартовый
  const who = [];
  for (const tag of g.tags) {
    for (const e of enemies) {
      if (!(THREAT_SETS[tag] && THREAT_SETS[tag].has(e.localized_name))) continue;
      const label = tag === "targeted" ? `${e.localized_name} (${TARGETED[e.localized_name]})` : e.localized_name;
      if (!who.some(w => w.startsWith(e.localized_name))) who.push(label);   // один герой — одно упоминание
    }
  }
  const need = who.length ? [`нужен против ${who.join(", ")}`] : [];
  const examples = tag => (tag === "targeted" ? ["Spirit Breaker", "Lion", "Doom"] : THREATS[tag].slice(0, 3)).join(", ");
  const idle = `Ситуативный: берут против ${g.tags.map(t => `${TAG_TEXT[t]} (${examples(t)})`).join(" или ")}.` +
    (enemies.length ? " В этом драфте таких нет — можно заменить на другой предмет." : " Добавь врагов — скажу, нужен ли он.");
  return { what: g.what, need, idle };
}

// Ответ на угрозу: какой предмет брать на каждой позиции (p — 0..4, h — твой герой).
const melee = h => h.attack_type === "Melee";
// бьёт с руки (а не кастер): ловкачи и силовые коры. Инвокеру/Штормe/Тинкеру предметы на атаку не нужны.
// Оффлейнерам (Акс, Марс…) предметы на атаку не советуем, даже если OpenDota пишет им роль Carry.
const attacker = (h, p) => p <= 2 && (h.primary_attr === "agi" ||
  ((h.primary_attr === "str" || h.primary_attr === "all") && (p === 0 || (p === 1 && has(h, "Carry")))));
const COUNTERS = [
  { tag: "magic", min: 2, why: "много магического урона",
    item: (p, h) => ["black_king_bar", "black_king_bar", "pipe", "glimmer_cape", "glimmer_cape"][p] },
  { tag: "disable", min: 2, why: "много контроля",
    item: (p, h) => ["black_king_bar", "black_king_bar", "black_king_bar", "lotus_orb", "force_staff"][p] },
  { tag: "physical", min: 2, why: "сильные физические коры",
    item: (p, h) => p <= 1
      ? (!attacker(h, p) ? (h.primary_attr === "str" ? "blade_mail" : "shivas_guard")
        : h.primary_attr === "str" ? "satanic" : "butterfly")
      : ["crimson_guard", "solar_crest", "ghost"][p - 2] },
  { tag: "evasion", min: 1, why: "уклонение — твои атаки будут промахиваться",
    item: (p, h) => p <= 2 && attacker(h, p) ? "monkey_king_bar" : null },
  { tag: "illusions", min: 1, why: "иллюзии и призывы",
    item: (p, h) => p > 2 ? null : !attacker(h, p) ? "shivas_guard"
      : p === 0 && melee(h) ? "bfury" : p <= 1 ? "mjollnir" : "shivas_guard" },
  { tag: "invis", min: 1, why: "невидимость",
    item: (p, h) => p === 4 ? "ward_sentry" : "dust" },
  { tag: "heal", min: 1, why: "лечение и регенерация",
    item: (p, h) => p <= 1 ? (attacker(h, p) ? "skadi" : "shivas_guard") : "spirit_vessel" },
  { tag: "silence", min: 1, why: "немота",
    item: (p, h) => p <= 1 ? (h.primary_attr === "agi" ? "manta" : "black_king_bar") : p <= 3 ? "lotus_orb" : "cyclone" },
  { tag: "mobile", min: 1, why: "мобильные, убегают",
    item: (p, h) => p <= 1 && !attacker(h, p) ? (p === 1 ? "orchid" : "sheepstick")
      : p === 0 ? (melee(h) ? "abyssal_blade" : "bloodthorn") : p === 1 ? "orchid" : "rod_of_atos" },
  { tag: "passive", min: 1, why: "сильные пассивки — Break их отключит",
    item: (p, h) => p <= 2 && attacker(h, p) ? "silver_edge" : null },
  { tag: "targeted", min: 2, why: "много опасных заклинаний в одну цель",
    item: (p, h) => p <= 1 ? "sphere" : p <= 3 ? "lotus_orb" : null },
];

const ATTR_ITEM = { str: "gauntlets", agi: "slippers", int: "mantle", all: "circlet" };
const ATTR_BRACER = { str: "bracer", agi: "wraith_band", int: "null_talisman", all: "bracer" };

// Старт и ранняя игра — по позиции и типу героя
function laneItems(p, h, spam) {
  const attr = h.primary_attr;
  const start = [
    ["tango", "flask", "branches", "branches", ...(melee(h) ? ["quelling_blade"] : []), ATTR_ITEM[attr]],
    ["tango", "faerie_fire", "branches", "branches", ATTR_ITEM[attr]],
    ["tango", "flask", "branches", ...(melee(h) ? ["quelling_blade"] : []), "ring_of_protection"],
    ["tango", "blood_grenade", "ward_observer", "branches", "branches", "faerie_fire"],
    ["tango", "flask", "ward_observer", "ward_sentry", "clarity", "branches"],
  ][p];
  const boots = p === 0 ? "power_treads"
    : p === 1 ? (attr === "int" ? "arcane_boots" : "power_treads")
    : p === 2 ? (melee(h) ? "phase_boots" : attr === "int" ? "arcane_boots" : "power_treads")
    : p === 3 ? "tranquil_boots" : "arcane_boots";
  const early = [
    [ATTR_BRACER[attr], "magic_wand", boots],
    ["bottle", "magic_wand", boots],
    ["magic_wand", ATTR_BRACER[attr], boots],
    ["magic_wand", "wind_lace", boots],
    ["magic_wand", "wind_lace", boots],
  ][p];
  return { start, early, spamNote: spam.length ? `Волшебная палочка обязательна: ${spam.join(", ")} часто кастуют` : "" };
}

// Анализ драфта: что брать против этих врагов на этой позиции
function draftCounters(p, h) {
  const enemies = picked(draft.e).map(id => HEROES[id]).filter(Boolean);
  const allies = picked(draft.a).map(id => HEROES[id]).filter(Boolean);
  const out = new Map();   // ключ предмета -> { key, reasons: [] }
  const add = (key, reason) => {
    if (!key) return;
    if (!out.has(key)) out.set(key, { key, reasons: [] });
    out.get(key).reasons.push(reason);
  };
  const hits = COUNTERS.map(c => ({ c, who: enemies.filter(e => THREAT_SETS[c.tag].has(e.localized_name)) }))
    .filter(x => x.who.length >= x.c.min)
    .sort((a, b) => b.who.length - a.who.length);
  for (const { c, who } of hits) add(c.item(p, h), `${c.why}: ${who.map(e => e.localized_name).join(", ")}`);
  // союзники: если в команде некому начинать драки — инициатором будешь ты
  if ((p === 2 || p === 3) && allies.length >= 2 && !allies.some(a => has(a, "Initiator")))
    add("blink", "в твоей команде нет инициатора — начинать драки придётся тебе");
  const spam = enemies.filter(e => THREAT_SETS.spam.has(e.localized_name)).map(e => e.localized_name);
  return { list: [...out.values()].slice(0, 6), enemies, spam };
}

// эти предметы — части других, но их часто берут как готовые
const CORE_OK_PARTS = new Set(["blink", "force_staff", "aether_lens", "orchid", "dragon_lance", "diffusal_blade"]);
const ITEM_BY_KEY = () => Object.fromEntries(Object.values(ITEMS).map(it => [it.key, it]));
// предметы одной строкой; повторы (2 ветки) — одной иконкой с «×2»; subs — подпись под иконкой
function buildItemsHTML(keys, byKey, subs = {}) {
  const counts = new Map();
  for (const k of keys) if (byKey[k]) counts.set(k, (counts.get(k) || 0) + 1);
  return `<div class="items">${[...counts].map(([k, n]) => { const it = byKey[k]; return `<div class="item" data-k="${esc(k)}" title="${esc(it.dname)}">
    <span class="ic"><img loading="lazy" src="${it.img ? CDN + it.img : ""}" alt="">${n > 1 ? `<b class="cnt">×${n}</b>` : ""}${itemBadge(k)}</span>
    ${esc(it.dname)}${subs[k] ? `<span class="sub">${subs[k]}</span>` : ""}</div>`; }).join("")}</div>`;
}

/* ---- пояснения к предметам: значок на иконке и карточка по нажатию ---- */
const draftEnemies = () => picked(draft.e).map(id => HEROES[id]).filter(Boolean);
// 🎯 — предмет нужен против этих врагов, 💡 — ситуативный и в этом драфте не нужен
function itemBadge(k) {
  const enemies = draftEnemies();
  const note = itemDraftNote(k, enemies);
  if (!note || note.core) return "";
  if (note.need.length) return `<i class="ibadge need" title="нужен в этом драфте">🎯</i>`;
  return enemies.length ? `<i class="ibadge idle" title="в этом драфте можно не брать">💡</i>` : "";
}
// во что собирается предмет: { ключ: [названия больших предметов] }
let USED_IN = null;
function usedIn(k) {
  if (!USED_IN) {
    USED_IN = {};
    for (const it of Object.values(ITEMS))
      if (!it.key.startsWith("recipe_")) for (const c of it.components || []) (USED_IN[c] = USED_IN[c] || []).push(it);
  }
  return (USED_IN[k] || []).sort((a, b) => (a.cost || 0) - (b.cost || 0)).map(it => it.dname).filter((n, i, a) => a.indexOf(n) === i);
}
function openItemCard(k) {
  const it = ITEM_BY_KEY()[k];
  if (!it) return;
  const enemies = draftEnemies();
  const note = itemDraftNote(k, enemies);
  const into = usedIn(k);
  // для предметов без нашего описания — характеристики и способность прямо из данных игры (на английском)
  const stats = (it.attrib || []).filter(a => a.display && a.value != null)
    .map(a => a.display.replace("{value}", a.value)).slice(0, 4);
  const abil = (it.abilities || []).map(a => `${a.title}: ${a.description}`).slice(0, 1);
  const auto = !note && (stats.length || abil.length)
    ? `<div class="ic-what">📋 ${[stats.map(esc).join(" · "), ...abil.map(esc)].filter(Boolean).join("<br>")}
       <div class="muted">(описание из данных игры)</div></div>` : "";
  const verdict = !note ? (into.length
      ? `${auto}<div class="ic-what">🔩 Это деталь — её покупают по пути к большому предмету.</div>`
      : auto || `<div class="muted">Для этого предмета пояснения пока нет.</div>`)
    : note.start ? `<div class="ic-core">🛒 Стартовый предмет — покупают в начале игры, до выхода на линию или в первые минуты.</div>`
    : note.core ? `<div class="ic-core">✅ Основной предмет — его берут почти в каждой игре, не зависит от врагов.</div>`
    : note.need.length ? note.need.map(w => `<div class="ic-need">🎯 ${esc(w)}</div>`).join("")
    : `<div class="ic-idle">💡 ${esc(note.idle)}</div>`;
  $("#item-card-body").innerHTML = `
    <div class="ic-head"><img src="${it.img ? CDN + it.img : ""}" alt=""><div><b>${esc(it.dname)}</b>
      ${it.cost ? `<div class="muted">${fmt(it.cost)} золота</div>` : ""}</div></div>
    ${note ? `<div class="ic-what">ℹ️ ${esc(note.what)}</div>` : ""}
    ${verdict}
    ${into.length ? `<div class="ic-into">⬆️ Потом собирается в: ${into.slice(0, 5).map(esc).join(", ")}${into.length > 5 ? " и др." : ""}</div>` : ""}
    ${enemies.length ? `<div class="muted" style="margin-top:8px">Враги в драфте: ${enemies.map(e => esc(e.localized_name)).join(", ")}</div>` : ""}`;
  $("#item-card").classList.add("open");
  haptic();
}
function closeItemCard() { $("#item-card").classList.remove("open"); }
document.addEventListener("click", e => {
  if (e.target.closest("#item-card .sheet")) return;
  if (e.target.closest("#item-card")) return closeItemCard();          // тап по затемнению — закрыть
  const el = e.target.closest(".item[data-k], .bal[data-k]");
  if (el) { e.stopPropagation(); openItemCard(el.dataset.k); }
}, true);

/* ---- варианты билдов: только про (itemPopularity + starts.json), без обычных пабликов ---- */
const BOOT_KEYS = ["power_treads", "phase_boots", "arcane_boots", "tranquil_boots", "boots"];
const LANE_BASICS = new Set(["tango", "flask", "branches", "faerie_fire", "clarity", "enchanted_mango",
  "ward_observer", "ward_sentry", "ward_dispenser", "blood_grenade"]);
const START_GOLD = 600;

// когда про-игроки покупают предметы на этом герое: { item: { g: игр, t: средняя минута } } из starts.json
function proTiming(heroId) {
  const src = ((STARTS || {}).timing || {})[heroId] || {};
  const s = {};
  for (const [k, [g, t]] of Object.entries(src)) s[k] = { g, t };
  return s;
}
const proRows = stage => Object.entries(stage || {}).map(([id, n]) => ({ it: ITEMS[id], n }))
  .filter(r => r.it && !r.it.key.startsWith("recipe_")).sort((a, b) => b.n - a.n);
const sameItems = (a, b) => a.slice().sort().join() === b.slice().sort().join();
const uniqVariants = vs => vs.filter((v, i) => v.items.length && !vs.slice(0, i).some(o => sameItems(o.items, v.items)));

/* ---- реальные стартовые закупы: starts.json (собирает collect_starts.py) ---- */
let STARTS = null;
async function loadStarts() {
  if (STARTS) return STARTS;
  try {
    const r = await fetch("starts.json", { cache: "no-cache" });
    STARTS = r.ok ? await r.json() : {};
  } catch (e) { STARTS = {}; }
  return STARTS;
}
const SUPPORT_START = new Set(["ward_observer", "ward_sentry", "ward_dispenser", "blood_grenade", "smoke_of_deceit"]);
const START_ORDER = ["tango", "flask", "faerie_fire", "enchanted_mango", "clarity", "branches"];
// порядок показа: сначала «характерные» предметы (топорик, цирклеты…), потом расходка
const sortStart = items => items.slice().sort((a, b) => {
  const ia = START_ORDER.indexOf(a), ib = START_ORDER.indexOf(b);
  if (ia < 0 && ib < 0) return a.localeCompare(b);
  if (ia < 0) return -1; if (ib < 0) return 1;
  return ia - ib;
});

// 3 заметно разных стартовых набора — только про: турнирные матчи и игры про-игроков вне турниров
function realStartVariants(heroId, p, byKey) {
  const data = STARTS || {};
  const pro = (data.pro || {})[heroId], pub = (data.propub || {})[heroId];
  if (!pro && !pub) return null;
  // варды, смок и даст покупают «на команду» в разных сочетаниях — при сравнении наборов их не учитываем
  const TEAM = new Set(["ward_observer", "ward_sentry", "ward_dispenser", "smoke_of_deceit", "dust"]);
  const cand = new Map();
  const addSrc = (src, name) => {
    if (!src) return;
    for (const [items, n, w] of src.sets) {
      const all = items.split(",");
      const own = all.filter(k => !TEAM.has(k));
      if (!own.length) continue;
      const key = own.join(",");
      const c = cand.get(key) || { items: own, sup: false, team: false, pro: null, pub: null };
      c.sup = c.sup || all.some(k => SUPPORT_START.has(k));
      c.team = c.team || all.some(k => TEAM.has(k));
      const s = c[name] || (c[name] = { n: 0, w: 0, share: 0 });
      s.n += n; s.w += w; s.share = s.n / src.total;
      cand.set(key, c);
    }
  };
  addSrc(pro, "pro"); addSrc(pub, "pub");
  let list = [...cand.values()].filter(c => Math.max(c.pro ? c.pro.n : 0, c.pub ? c.pub.n : 0) >= 2);
  // саппортские наборы (варды, грената) — для 4–5 позиции, остальные — для коров
  const isSup = c => c.sup;
  const byRole = list.filter(c => (p >= 3) === isSup(c));
  if (byRole.length) list = byRole;
  const score = c => Math.max(c.pro ? c.pro.share : 0, c.pub ? c.pub.share : 0);
  list.sort((a, b) => score(b) - score(a));
  // берём наборы, которые отличаются хотя бы двумя видами предметов
  const types = c => new Set(c.items);
  const diff = (a, b) => { const A = types(a), B = types(b); let d = 0; for (const k of A) if (!B.has(k)) d++; for (const k of B) if (!A.has(k)) d++; return d; };
  const chosen = [];
  for (const minDiff of [2, 1]) {          // сначала сильно разные; если мало — хотя бы чем-то отличающиеся
    for (const c of list) {
      if (chosen.length === 3) break;
      if (!chosen.includes(c) && chosen.every(o => diff(o, c) >= minDiff)) chosen.push(c);
    }
  }
  const stat = (s, label) => s ? `${label}: ${Math.round(s.share * 100)}% (${fmt(s.n)} игр${s.n >= 10 ? `, ${Math.round(s.w / s.n * 100)}% побед` : ""})` : "";
  return chosen.map((c, i) => ({
    label: `${["1️⃣", "2️⃣", "3️⃣"][i]} Вариант ${i + 1}`,
    note: [stat(c.pro, "🏆 турниры"), stat(c.pub, "👤 про и топ-200 Европы в пабах")].filter(Boolean).join(" · ") +
      (c.team && p >= 3 ? " · + варды/смок на команду" : ""),
    items: sortStart(c.items),
  }));
}

function startVariants(pop, lane, byKey, p) {
  // варды и смоки про-коры берут «на команду» — в личный стартовый билд их не ставим
  const skip = new Set(["ward_dispenser", "smoke_of_deceit", "dust", ...(p <= 2 ? ["ward_observer", "ward_sentry"] : [])]);
  const rows = proRows(pop.start_game_items).filter(r => !skip.has(r.it.key));
  const games = Math.max(1, ...rows.map(r => r.n));          // танго берут почти все — ≈ число игр
  const share = k => { const r = rows.find(r => r.it.key === k); return r ? Math.round(r.n / games * 100) : 0; };
  // набираем самые популярные у про предметы на стартовое золото
  const greedy = exclude => {
    let gold = START_GOLD; const out = [];
    for (const { it } of rows) if (!exclude.has(it.key) && (it.cost || 0) <= gold) { out.push(it.key); gold -= it.cost || 0; }
    while (gold >= 50 && out.filter(k => k === "branches").length < 3) { out.push("branches"); gold -= 50; }
    return out;
  };
  const special = items => items.filter(k => !LANE_BASICS.has(k));
  const note = items => { const a = special(items)[0]; return a && byKey[a] ? `${share(a)}% про берут ${byKey[a].dname}` : ""; };
  const v1 = rows.length ? greedy(new Set()) : [];
  const v2 = rows.length ? greedy(new Set(special(v1))) : [];   // без «фирменных» предметов первого варианта
  return uniqVariants([
    { label: "⭐ Чаще всего у про", note: note(v1), items: v1 },
    { label: "🔁 Другой вариант у про", note: note(v2), items: v2 },
    { label: "🧠 Под драфт и позицию", note: "", items: lane.start },
  ]);
}

function earlyVariants(pop, pub, lane, byKey) {
  const rows = proRows(pop.early_game_items);
  // сапоги часто доапгрейживают чуть позже — считаем покупки и в ранней, и в мид-игре
  const bootCount = {};
  for (const st of ["early_game_items", "mid_game_items"])
    for (const { it, n } of proRows(pop[st])) if (BOOT_KEYS.includes(it.key)) bootCount[it.key] = (bootCount[it.key] || 0) + n;
  let boots = Object.keys(bootCount).filter(k => k !== "boots");
  if (!boots.length) boots = Object.keys(bootCount);
  boots = boots.sort((a, b) => bootCount[b] - bootCount[a]).map(k => ({ it: byKey[k], n: bootCount[k] })).filter(b => b.it);
  const bootsTotal = boots.reduce((s, r) => s + r.n, 0) || 1;
  // только готовые предметы (без частей вроде Ring of Health / Void Stone)
  const parts = new Set(Object.values(ITEMS).flatMap(it => it.components || []));
  const others = rows.filter(r => !BOOT_KEYS.includes(r.it.key) && !LANE_BASICS.has(r.it.key) &&
    (!parts.has(r.it.key) || CORE_OK_PARTS.has(r.it.key)) && !CONSUMABLES.has(r.it.key) &&
    (r.it.cost || 0) >= 400 && (r.it.cost || 0) <= 2500).slice(0, 3).map(r => r.it.key);
  const vs = boots.slice(0, 3).map(b => ({ label: `👟 ${b.it.dname}`,
    note: `${Math.round(b.n / bootsTotal * 100)}% про`, items: [b.it.key, ...others] }));
  vs.push({ label: "🧠 Под драфт и позицию", note: lane.spamNote, items: lane.early });
  return uniqVariants(vs);
}

function coreVariants(pop, pub, counters, used, byKey) {
  const parts = new Set(Object.values(ITEMS).flatMap(it => it.components || []));
  const okCore = it => it && (it.cost || 0) >= 2000 && (!parts.has(it.key) || CORE_OK_PARTS.has(it.key)) &&
    !CONSUMABLES.has(it.key) && !/recipe_|boots|treads|travel|greaves/.test(it.key) && !used.has(it.key);
  const pro = {};
  for (const st of ["mid_game_items", "late_game_items"])
    for (const { it, n } of proRows(pop[st])) if (okCore(it)) pro[it.key] = (pro[it.key] || 0) + n;
  const proTop = Object.keys(pro).sort((a, b) => pro[b] - pro[a]);
  // не ставим рядом предмет и его улучшение (Blink + Swift Blink)
  const pick = list => list.slice(0, 6).filter((k, _, all) => !all.some(o => ((byKey[o] || {}).components || []).includes(k))).slice(0, 3);
  const vPro = pick(proTop);
  // второй вариант у про: без предметов первого
  const vPro2 = pick(proTop.filter(k => !vPro.includes(k)));
  const big = counters.map(c => c.key).filter(k => byKey[k] && (byKey[k].cost || 0) >= 2000).slice(0, 2);
  const vDraft = pick([...big, ...proTop.filter(k => !big.includes(k))]);
  const subs = {};
  for (const k of new Set([...vPro, ...vPro2, ...vDraft])) {
    const s = pub[k];   // время покупки у про-игроков
    if (s && s.g >= 3) subs[k] = `~${Math.round(s.t)} мин`;
  }
  return {
    subs,
    variants: uniqVariants([
      { label: "⭐ Популярно у про", note: vPro[0] ? `${byKey[vPro[0]].dname} — в ${fmt(pro[vPro[0]])} про-играх` : "", items: vPro },
      { label: "🔁 Другой путь у про", note: vPro2[0] ? `${byKey[vPro2[0]].dname} — в ${fmt(pro[vPro2[0]])} про-играх` : "", items: vPro2 },
      { label: "🧠 Под этот драфт", note: big.length ? "сначала предметы против врагов" : "", items: big.length ? vDraft : [] },
    ]),
  };
}

/* ---- итоговый билд: про + предметы под драфт, вперемешку и по времени покупки ---- */
// грубая оценка, к какой минуте позиция накопит на предмет (если нет данных паблика)
const GPM_BY_POS = [620, 580, 470, 340, 300];
const estMinute = (it, p) => Math.round(6 + (it.cost || 0) / GPM_BY_POS[p] * 1.6);

function balancedBuild(p, h, pop, pubAll, counters, spam, byKey) {
  const parts = new Set(Object.values(ITEMS).flatMap(it => it.components || []));
  const finished = it => it && (!parts.has(it.key) || CORE_OK_PARTS.has(it.key));
  const reasonsOf = new Map(counters.map(c => [c.key, c.reasons]));

  // --- ранняя игра: сапоги и предметы про + дешёвое, что требует драфт
  const bootCount = {};
  for (const st of ["early_game_items", "mid_game_items"])
    for (const { it, n } of proRows(pop[st])) if (BOOT_KEYS.includes(it.key)) bootCount[it.key] = (bootCount[it.key] || 0) + n;
  const bootKeys = Object.keys(bootCount).sort((a, b) => bootCount[b] - bootCount[a]);
  const topBoot = bootKeys.find(k => k !== "boots") || bootKeys[0];
  // доля среди «улучшенных» сапог (простые Boots of Speed — это промежуточный шаг)
  const bootsTotal = bootKeys.filter(k => topBoot === "boots" || k !== "boots").reduce((s, k) => s + bootCount[k], 0) || 1;
  const earlyRows = proRows(pop.early_game_items);
  const early = new Map();
  const addE = (k, pro, why) => {
    if (!byKey[k]) return;
    const e = early.get(k) || { key: k, pro: null, why: [] };
    if (pro) e.pro = pro;
    if (why) e.why.push(why);
    early.set(k, e);
  };
  if (topBoot) addE(topBoot, `${Math.round(bootCount[topBoot] / bootsTotal * 100)}% про берут эти сапоги`);
  // в раннюю игру — только собранные предметы и несколько самостоятельных (Bottle, Wind Lace…), без частей вроде Javelin
  const STANDALONE_EARLY = new Set(["bottle", "wind_lace", "infused_raindrop", "blight_stone", "orb_of_venom", "magic_stick"]);
  earlyRows.filter(r => !BOOT_KEYS.includes(r.it.key) && !LANE_BASICS.has(r.it.key) && finished(r.it) &&
      ((r.it.components || []).length || STANDALONE_EARLY.has(r.it.key)) &&
      !CONSUMABLES.has(r.it.key) && (r.it.cost || 0) >= 400 && (r.it.cost || 0) <= 2500)
    .slice(0, 2).forEach(r => addE(r.it.key, `частый ранний предмет у про`));
  if (spam.length) addE("magic_wand", null, `часто кастуют: ${spam.join(", ")}`);
  for (const c of counters) if (byKey[c.key] && (byKey[c.key].cost || 0) < 1500) c.reasons.forEach(r => addE(c.key, null, r));

  // --- основа: чередуем предметы про и предметы против драфта (примерно поровну), 6 слотов
  const pro = {};
  for (const st of ["mid_game_items", "late_game_items"])
    for (const { it, n } of proRows(pop[st]))
      if (it && (it.cost || 0) >= 2000 && finished(it) && !CONSUMABLES.has(it.key) && !/boots|treads|travel|greaves/.test(it.key))
        pro[it.key] = (pro[it.key] || 0) + n;
  const proTop = Object.keys(pro).sort((a, b) => pro[b] - pro[a]).filter(k => !early.has(k));
  const ctrTop = counters.map(c => c.key).filter(k => byKey[k] && (byKey[k].cost || 0) >= 1500 && !early.has(k)).slice(0, 3);
  const order = [];
  for (let i = 0; order.length < 8 && (i < proTop.length || i < ctrTop.length); i++) {
    for (const k of [proTop[i], ctrTop[i]]) if (k && !order.includes(k)) order.push(k);
  }
  // не держим рядом предмет и его улучшение (Blink + Swift Blink)
  const core = order.filter((k, _, all) => !all.some(o => ((byKey[o] || {}).components || []).includes(k))).slice(0, 6)
    .map(k => {
      const s = pubAll[k];              // время покупки у про-игроков (если есть данные)
      const known = s && s.g >= 3;
      return {
        key: k,
        t: known ? s.t : estMinute(byKey[k], p), tKnown: known,
        pro: pro[k] ? `про: в ${fmt(pro[k])} играх` : null,
        why: reasonsOf.get(k) || [],
      };
    }).sort((a, b) => a.t - b.t);
  return { early: [...early.values()], core };
}

function balRowsHTML(rows, byKey, showTime, enemies) {
  return rows.map(r => {
    const it = byKey[r.key];
    // для ситуативных предметов: что делает и нужен ли он против этих врагов
    const note = itemDraftNote(r.key, enemies);
    const need = note && !r.why.length ? note.need : [];
    const idle = note && !r.why.length && !need.length ? note.idle : "";
    return `<div class="bal" data-k="${esc(r.key)}"><img loading="lazy" src="${it.img ? CDN + it.img : ""}" alt="">
      <div class="bt"><b>${esc(it.dname)}</b>${showTime ? ` <span class="tm">${r.tKnown ? "~" : "≈"}${Math.round(r.t)} мин</span>` : ""}
        ${r.pro ? `<div class="tag tp">🏆 ${esc(r.pro)}</div>` : ""}
        ${r.why.map(w => `<div class="tag tc">🎯 ${esc(w)}</div>`).join("")}
        ${need.map(w => `<div class="tag tc">🎯 ${esc(w)}</div>`).join("")}
        ${note ? `<div class="tag ti">ℹ️ ${esc(note.what)}</div>` : ""}
        ${idle ? `<div class="tag tidle">💡 ${esc(idle)}</div>` : ""}</div></div>`;
  }).join("");
}

// Последние игры конкретных про-игроков на этом герое (starts.json → builds).
// Формат записи: [имя, команда, время старта, победа 0/1, тип "pub"|"lobby"|"league", "старт,через,запятую", "предмет:минута,…"]
// у D2PT некоторые герои называются иначе, чем в OpenDota
const D2PT_NAMES = { "Outworld Devourer": "Outworld Destroyer" };
const GAME_KIND = { pub: "паблик", lobby: "скрим/лобби", league: "турнир" };
function proPlayersHTML(h, byKey) {
  const list = (((STARTS || {}).builds) || {})[h.id] || [];
  if (!list.length) return `<h2>👤 Как собирают про и топ-200 Европы</h2>
    <div class="card"><div class="muted">Пока нет недавних игр про-игроков на этом герое. Данные обновляются каждую неделю.</div></div>`;
  const rows = list.slice(0, 6).map(([name, team, ts, win, kind, start, core]) => {
    const coreItems = (core || "").split(",").filter(Boolean).map(x => x.split(":"));
    const subs = Object.fromEntries(coreItems.map(([k, m]) => [k, `${m} мин`]));
    return `<div class="var">
      <div class="vl">${esc(name)}${team ? ` <span>· ${esc(team)}</span>` : ""}
        <span>· ${GAME_KIND[kind] || kind} · <b class="${win ? "good" : "bad"}">${win ? "победа" : "поражение"}</b> · ${ago(ts)}</span></div>
      ${start ? buildItemsHTML(sortStart(start.split(",")), byKey) : ""}
      ${coreItems.length ? buildItemsHTML(coreItems.map(([k]) => k), byKey, subs) : ""}
    </div>`;
  }).join("");
  return `<h2>👤 Как собирают про и топ-200 Европы</h2>
    <div class="card build">${rows}
      <div class="why">Сверху — стартовый закуп, ниже — большие предметы и минута покупки.
        Нажми на предмет — расскажу, что он делает и нужен ли он против твоих врагов (🎯 нужен, 💡 можно не брать).</div></div>`;
}

function draftBuildHTML(h, pop) {
  const byKey = ITEM_BY_KEY();
  const myFits = fitsPosition(h, draft.me);
  const p = myFits ? draft.me : ([0, 1, 2, 3, 4].find(i => fitsPosition(h, i)) ?? draft.me);
  const { list, enemies, spam } = draftCounters(p, h);
  const lane = laneItems(p, h, spam);
  const timing = proTiming(h.id);               // когда про-игроки покупают предметы
  const real = realStartVariants(h.id, p, byKey);
  const starts = real && real.length ? real : startVariants(pop, lane, byKey, p);
  const startsNote = real && real.length && STARTS.updated
    ? `Реальные закупы до горна — как в гайдах про и топ-ладдера: турнирные матчи за ${STARTS.pro_days} дней` +
      (STARTS.propub_games ? ` и ${fmt(STARTS.propub_games)} пабов про и топ-200 Европы` : "") + `. Обновлено ${STARTS.updated}.` : "";
  const earlies = earlyVariants(pop, timing, lane, byKey);
  const used = new Set([...lane.start, ...lane.early]);
  const core = coreVariants(pop, timing, list, used, byKey);
  const varsHTML = (vs, subs) => vs.map(v => `<div class="var"><div class="vl">${v.label}${v.note ? ` <span>· ${esc(v.note)}</span>` : ""}</div>
    ${buildItemsHTML(v.items, byKey, subs)}</div>`).join("");

  const bal = balancedBuild(p, h, pop, timing, list, spam, byKey);
  const draftNote = !enemies.length
    ? `<div class="why">Добавь врагов в драфте — добавлю в билд предметы против них (🎯).</div>`
    : !list.length ? `<div class="why">Против этих врагов ничего особого не нужно — собирай как про.</div>` : "";

  return `
    <h2>⚖️ Итоговый билд · ${p + 1} · ${POSITIONS[p]}</h2>
    ${myFits ? "" : `<p class="muted" style="margin-top:0">На твою позицию (${draft.me + 1} · ${POSITIONS[draft.me]}) этот герой обычно не ходит, поэтому билд для ${p + 1} · ${POSITIONS[p]}.</p>`}
    <div class="card build">
      <div class="st">🛒 Старт — 3 варианта про и топ-ладдера</div>${varsHTML(starts)}
      ${startsNote ? `<div class="why">${esc(startsNote)}</div>` : ""}
      <div class="st">⏱ Ранняя игра</div>${balRowsHTML(bal.early, byKey, false, enemies)}
      <div class="st">⚔️ Основа — по порядку покупки</div>${balRowsHTML(bal.core, byKey, true, enemies)}
      ${draftNote}
      <div class="why legend">Нажми на предмет — подробнее. 🏆 — так собирают про · 🎯 — нужно против этого драфта · ℹ️ — что делает предмет ·
        💡 — ситуативный, в этом драфте можно не брать · ~ — среднее время покупки у про, ≈ — примерная оценка</div>
    </div>
    ${proPlayersHTML(h, byKey)}
    <details class="pro-items alt"><summary>🔀 Другие варианты: сапоги, основа</summary>
      <div class="card build">
        <div class="st">⏱ Ранняя игра</div>${varsHTML(earlies)}
        ${core.variants.length ? `<div class="st">⚔️ Основа героя</div>${varsHTML(core.variants, core.subs)}
          ${Object.keys(core.subs).length ? `<div class="why">Под предметом — когда его обычно покупают про.</div>` : ""}` : ""}
        <div class="why">Нажми на предмет — расскажу, что он делает и нужен ли он против твоих врагов. В углу иконки: 🎯 — нужен в этом драфте, 💡 — можно не брать.</div>
      </div>
    </details>`;
}

/* ================================================================ карточка героя */
function pickItems(stage, late) {
  return Object.entries(stage || {}).sort((a, b) => b[1] - a[1]).map(([id, n]) => [ITEMS[id], n])
    .filter(([it]) => it && !it.key.startsWith("recipe_") &&
      (!late || (!CONSUMABLES.has(it.key) && (it.components || (it.cost || 0) >= 2000))))
    .slice(0, TOP_ITEMS);
}
function itemsHTML(list) {
  if (!list.length) return `<div class="muted">Нет данных</div>`;
  return `<div class="items">${list.map(([it, n]) => `<div class="item" data-k="${esc(it.key)}" title="${esc(it.dname || it.key)}">
    <img loading="lazy" src="${it.img ? CDN + it.img : ""}" alt="">${esc(it.dname || it.key)}<br><b>${n}</b></div>`).join("")}</div>`;
}
function muHTML(rows) {
  return `<div class="mu">${rows.map(r => `<button class="mu-row" data-id="${r.h.id}">
    <img loading="lazy" src="${heroImg(r.h)}" alt=""><span class="nm">${esc(r.h.localized_name)}</span>
    <span class="val ${wrClass(r.wr)}">${r.wr.toFixed(0)}%</span><span class="g">${r.g} игр</span></button>`).join("")}</div>`;
}

function ago(ts) {
  const s = Date.now() / 1000 - ts;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " мин назад";
  if (s < 86400) return Math.round(s / 3600) + " ч назад";
  return Math.round(s / 86400) + " дн назад";
}
function matchesHTML(list) {
  return list.map(m => {
    const won = m.radiant === m.radiant_win;
    const dur = Math.floor(m.duration / 60) + ":" + String(m.duration % 60).padStart(2, "0");
    return `<button class="match-row" data-mid="${m.match_id}">
      <span class="res ${won ? "good" : "bad"}">${won ? "Победа" : "Поражение"}</span>
      <span class="mid"><span>${esc(m.league_name || "Про-матч")}</span>
        <span class="muted">${ago(m.start_time)} · ${dur}</span></span>
      <span class="kda">${m.kills}/${m.deaths}/${m.assists}</span></button>`;
  }).join("");
}

async function openHero(id, push = true) {
  const h = HEROES[id];
  if (!h) return;
  if (push) {
    const cur = document.querySelector(".view.active").id.replace("view-", "");

  currentHeroId = id;
  const v = $("#view-hero");

  const stat = (val, label, games) => `<div class="card stat"><div class="v ${wrClass(val)}">${val == null ? "—" : val.toFixed(1) + "%"}</div>
    <div class="l">${label}${games ? " · " + fmt(games) + " игр" : ""}</div></div>`;
  v.innerHTML = `

    <button class="guide-btn" data-url="https://dota2protracker.com/hero/${encodeURIComponent(D2PT_NAMES[h.localized_name] || h.localized_name)}">
      🔗 Открыть в Dota Pro Tracker <span>· гайд и билды игроков 7000+ MMR</span></button>
    <div id="hero-draft-build"><div class="loading">Собираю билд под драфт…</div></div>
    <h2>📈 Статистика</h2>
    <div class="stats">
      ${stat(pro.wr, "Про-сцена", pro.p)}
      ${stat(hi.wr, "Divine + Immortal", hi.p)}
      ${stat(all.wr, "Паблик, все ранги", all.p)}
      <div class="card stat"><div class="v">${fmt(h.pro_ban || 0)}</div><div class="l">Банов в про</div></div>
    </div>
    <div id="hero-build"><div class="loading">Загружаю закупы…</div></div>`;
  showView("hero");

  try {
    const [pop, mu, , pm] = await Promise.all([itemPop(id), matchups(id), loadItems(),
      proMatches(id).catch(() => []), loadStarts()]);
    if (currentHeroId !== id) return;
    const rows = mu.filter(m => m.games_played >= MIN_MATCHUP_GAMES && HEROES[m.hero_id])
      .map(m => ({ h: HEROES[m.hero_id], wr: m.wins / m.games_played * 100, g: m.games_played }))
      .sort((a, b) => a.wr - b.wr);
    $("#hero-draft-build").innerHTML = draftBuildHTML(h, pop);
    $("#hero-build").innerHTML = `
      <details class="pro-items"><summary>📊 Что покупают про-игроки</summary>
        <h2>🛒 Стартовый закуп</h2><div class="card">${itemsHTML(pickItems(pop.start_game_items, false))}</div>
        <h2>⏱ Ранняя игра</h2><div class="card">${itemsHTML(pickItems(pop.early_game_items, false))}</div>
        <h2>⚔️ Мид-гейм</h2><div class="card">${itemsHTML(pickItems(pop.mid_game_items, true))}</div>
        <h2>👑 Лейт</h2><div class="card">${itemsHTML(pickItems(pop.late_game_items, true))}</div>
        <p class="muted">Под предметами — число про-матчей, в которых их покупали. Данные: OpenDota.</p>
      </details>
      ${rows.some(r => r.wr < 50) ? `<h2>😣 Тяжело против</h2><div class="card">${muHTML(rows.filter(r => r.wr < 50).slice(0, 5))}</div>` : ""}
      ${rows.some(r => r.wr > 50) ? `<h2>😎 Хорош против</h2><div class="card">${muHTML(rows.filter(r => r.wr > 50).reverse().slice(0, 5))}</div>` : ""}
      ${pm.length ? `<h2>🎮 Последние про-матчи</h2><div class="card">${matchesHTML(pm.slice(0, 10))}</div>` : ""}`;
  } catch (e) {
    if (currentHeroId === id) {
      $("#hero-draft-build").innerHTML = "";
      $("#hero-build").innerHTML = `<div class="error">Не удалось загрузить закупы. Попробуй позже.</div>`;

  }
}

/* ================================================================ драфт */
const emptyDraft = () => ({ a: Array(TEAM_SIZE).fill(null), e: Array(TEAM_SIZE).fill(null), me: 0 });
let draft = lsGet("draft") || emptyDraft();
const saveDraft = () => lsSet("draft", draft);
const picked = arr => arr.filter(id => id != null);   // герои без пустых позиций
// свободные позиции в своей команде (не твоя и без героя)
// свободные позиции команды: без героя (и в своей команде — не твоя)
const freePositions = side => draft[side].map((id, i) => id == null && !(side === "a" && i === draft.me) ? i : -1).filter(i => i >= 0);

// приводит драфт к виду «5 позиций у каждой команды» (в т.ч. старый формат без позиций)
function normDraft(d) {
  const fix = arr => Array.from({ length: TEAM_SIZE }, (_, i) => arr && arr[i] != null && HEROES[arr[i]] ? arr[i] : null);
  if (d.me == null) d = { ...d, me: 0, a: [null, ...(d.a || [])] };
  const me = Math.min(Math.max(+d.me || 0, 0), TEAM_SIZE - 1);
  const a = fix(d.a); a[me] = null;
  return { a, e: fix(d.e), me };
}

function slotHTML(side, id, idx) {
  const h = id != null && HEROES[id];
  const role = `<span class="role">${idx + 1} · ${POSITIONS[idx]}</span>`;
  if (h) return `<button class="slot ${side === "a" ? "ally" : "enemy"} filled" data-side="${side}" data-idx="${idx}" data-id="${id}">
    <img src="${heroImg(h)}" alt=""><span class="x">✕</span>${role}</button>`;
  return `<button class="slot empty" data-side="${side}" data-idx="${idx}" data-add="1">
    <span class="num">${idx + 1}</span><span class="role">${POSITIONS[idx]}</span></button>`;
}
function renderDraft() {
  $("#ally-slots").innerHTML = draft.a.map((id, i) => i === draft.me
    ? `<div class="slot me"><span class="num">Ты</span><span class="role">${i + 1} · ${POSITIONS[i]}</span></div>`
    : slotHTML("a", id, i)).join("");
  $("#enemy-slots").innerHTML = draft.e.map((id, i) => slotHTML("e", id, i)).join("");
  $("#add-ally").hidden = !freePositions("a").length;
  $("#add-enemy").hidden = !freePositions("e").length;
  $("#recs-title").textContent = `✅ Советую взять на ${draft.me + 1} · ${POSITIONS[draft.me]}`;
  renderRecs();
}

let recsToken = 0;
async function renderRecs() {
  const token = ++recsToken;
  const box = $("#recs");
  box.innerHTML = `<div class="loading">Считаю…</div>`;
  try {
    const allies = picked(draft.a), enemies = picked(draft.e);
    const [tables, synTables] = await Promise.all([
      Promise.all(enemies.map(async e => {
        const t = {};
        for (const m of await matchups(e)) t[m.hero_id] = m;
        return t;
      })),
      // синергия с союзниками; если Explorer не ответил — просто без неё
      Promise.all(allies.map(a => synergy(a).then(rows => {
        const t = {}; let g = 0, w = 0;
        for (const r of rows) { t[r.hero_id] = { g: +r.games, w: +r.wins }; g += +r.games; w += +r.wins; }
        return { t, base: g ? w / g : 0.5 };
      }).catch(() => null))),
    ]);
    if (token !== recsToken) return;
    const synFailed = allies.length && synTables.every(x => !x);
    // чего не хватает команде: роли и тип урона
    const allyHeroes = allies.map(a => HEROES[a]).filter(Boolean);
    const missingRoles = allyHeroes.length ? NEEDED_ROLES.filter(r => r !== "Carry" || draft.me !== 0)
      .filter(r => !allyHeroes.some(a => (a.roles || []).includes(r))) : [];
    const physN = allyHeroes.filter(a => THREAT_SETS.physical.has(a.localized_name)).length;
    const magN = allyHeroes.filter(a => THREAT_SETS.magic.has(a.localized_name)).length;
    const needDmg = allyHeroes.length >= 2 ? (magN === 0 ? "magic" : physN === 0 ? "physical" : null) : null;
    const taken = new Set([...allies, ...enemies]);
    const recs = [];
    for (const h of HERO_LIST) {
      if (taken.has(h.id)) continue;
      if (!fitsPosition(h, draft.me)) continue;   // советуем только героев под твою позицию
      // если враг E часто проигрывает герою X — X хорош против E
      const parts = enemies.map((e, i) => {
        const m = tables[i][h.id] || { wins: 0, games_played: 0 };
        const enemyWr = (m.wins + DRAFT_PRIOR * 0.5) / (m.games_played + DRAFT_PRIOR);
        return { e, v: (0.5 - enemyWr) * 100 };
      });
      const hi = pub(h, HIGH);
      const meta = hi.p >= MIN_PUB_PICKS ? (hi.wr - 50) * META_WEIGHT : 0;
      // насколько чаще союзник A побеждает, когда X в его команде (относительно его обычного винрейта)
      const syn = allies.map((a, i) => {
        const s = synTables[i];
        if (!s) return null;
        const m = s.t[h.id] || { g: 0, w: 0 };
        return { a, g: m.g, v: ((m.w + SYNERGY_PRIOR * s.base) / (m.g + SYNERGY_PRIOR) - s.base) * 100 * SYNERGY_WEIGHT };
      }).filter(Boolean);
      // закрывает то, чего нет в команде
      const fills = missingRoles.filter(r => (h.roles || []).includes(r)).slice(0, 2).map(r => ROLE_RU[r].toLowerCase());
      if (needDmg && THREAT_SETS[needDmg].has(h.localized_name)) fills.push(needDmg === "magic" ? "магический урон" : "физический урон");
      const team = fills.length * FILL_BONUS;
      recs.push({ h, parts, meta, syn, fills, team,
        score: parts.reduce((s, p) => s + p.v, 0) + syn.reduce((s, p) => s + p.v, 0) + team + meta });
    }
    recs.sort((a, b) => b.score - a.score);

    // Пока известны не все враги — враг ещё может законтрить тебя своими следующими пиками.
    // Для лучших кандидатов смотрим, кто из популярных и ещё свободных героев их контрит, и штрафуем.
    const k = enemies.length, unknown = TEAM_SIZE - k;
    let top = recs.slice(0, DRAFT_CHECK);
    if (unknown > 0) {
      const pool = HERO_LIST.filter(x => !taken.has(x.id))
        .sort((a, b) => pub(b, HIGH).p - pub(a, HIGH).p).slice(0, COUNTER_POOL);
      const poolIds = new Set(pool.map(x => x.id));
      const own = await Promise.all(top.map(r => matchups(r.h.id).catch(() => [])));
      if (token !== recsToken) return;
      top.forEach((r, i) => {
        // насколько герой X обыгрывает кандидата (п.п.), со сглаживанием малых выборок
        const threats = own[i].filter(m => poolIds.has(m.hero_id) && m.hero_id !== r.h.id)
          .map(m => ({ id: m.hero_id, v: (0.5 - (m.wins + DRAFT_PRIOR * 0.5) / (m.games_played + DRAFT_PRIOR)) * 100 }))
          .sort((a, b) => b.v - a.v);
        const worst = threats.slice(0, 3);
        r.risk = worst.length ? Math.max(0, worst.reduce((s, t) => s + t.v, 0) / worst.length) : 0;
        r.counters = threats.filter(t => t.v >= 6).slice(0, 2).map(t => HEROES[t.id].localized_name);
        r.score -= r.risk * RISK_WEIGHT * unknown / TEAM_SIZE;
      });
      top.sort((a, b) => b.score - a.score);
    }

    const phase = k === 0 ? `🕐 <b>Первый пик</b> — врагов ещё не видно. Советую сильных в мете героев, которых трудно законтрить.`
      : k <= 2 ? `🕑 <b>${k === 1 ? "Виден 1 враг" : "Видно 2 врага"}</b> — советую героев, сильных против ${k === 1 ? "него" : "них"}, и чтобы у врага осталось мало контрпиков на ${unknown} оставшихся ${unknown === 4 ? "пика" : "пика"}.`
      : k <= 4 ? `🕒 <b>Видно ${k} врага</b> — контрпики против них. У врага осталось ${unknown} ${unknown === 1 ? "пик" : "пика"}, риск получить контрпик меньше.`
      : `🎯 <b>Все враги известны</b> — бери жёсткий контрпик, ответить тебе уже нечем.`;
    let html = `<div class="phase">${phase}</div>`;
    html += top.slice(0, DRAFT_TOP).map(r => {
      const det = r.parts.slice().sort((a, b) => b.v - a.v).slice(0, 3)
        .map(p => `${esc(HEROES[p.e].localized_name)} <span class="${p.v >= 0 ? "good" : "bad"}">${sign(p.v)}</span>`);
      det.push(`мета <span class="${r.meta >= 0 ? "good" : "bad"}">${sign(r.meta)}</span>`);
      const synLine = r.syn.length ? `<div class="det">🤝 ${r.syn.slice().sort((a, b) => b.v - a.v)
        .map(p => `с ${esc(HEROES[p.a].localized_name)} <span class="${p.v >= 0 ? "good" : "bad"}">${sign(p.v)}</span>`).join(" · ")}</div>` : "";
      const fillLine = r.fills.length ? `<div class="det">🧩 закрывает: ${r.fills.map(esc).join(", ")} <span class="good">+${r.team.toFixed(1)}</span></div>` : "";
      const allGood = r.parts.length >= 2 && r.parts.every(p => p.v >= 1);
      const teamGood = r.syn.length >= 1 && r.syn.every(p => p.v >= 2);
      const safety = unknown === 0 || r.risk == null ? ""
        : r.counters.length ? `<div class="risk bad">⚠️ контрят: ${r.counters.map(esc).join(", ")}</div>`
        : r.risk < 4 ? `<div class="risk good">✅ мало контрпиков</div>` : "";
      return `<button class="rec" data-id="${r.h.id}"><img loading="lazy" src="${heroImg(r.h)}" alt="">
        <div class="mid"><div class="nm">${esc(r.h.localized_name)}${allGood ? ` <span class="badge">контрит всех видимых</span>` : ""}${teamGood ? ` <span class="badge">хорош с командой</span>` : ""}</div>
          ${r.parts.length || r.meta ? `<div class="det">⚔️ ${det.join(" · ")}</div>` : ""}${synLine}${fillLine}${safety}</div>
        <div class="sc ${r.score >= 0 ? "good" : "bad"}">${sign(r.score)}</div></button>`;
    }).join("") || `<div class="muted">Нет подходящих героев, попробуй другую роль.</div>`;

    if (allies.length >= 2) {
      const missing = NEEDED_ROLES.filter(r => !allies.some(a => (HEROES[a].roles || []).includes(r)));
      if (missing.length) html += `<div class="warn">⚠️ В команде нет: <b>${missing.map(r => ROLE_RU[r].toLowerCase()).join(", ")}</b>. Учти это при пике.</div>`;
    }
    if (synFailed) html += `<div class="warn">Не удалось загрузить, кто с кем хорошо играет (сервер OpenDota перегружен) — советую без учёта синергии с командой.</div>`;
    html += `<p class="muted" style="margin-bottom:0">👆 Нажми на героя — покажу билд под этот драфт.<br>Оценка: ⚔️ преимущество против каждого видимого врага в про-матчах (п.п. винрейта) + сила в мете` +
      (allies.length ? ` + 🤝 насколько чаще твои союзники побеждают вместе с этим героем + 🧩 то, чего не хватает команде` : "") +
      (unknown > 0 ? ` − риск, что его законтрят оставшимися пиками.` : `.`) + `</p>`;
    box.innerHTML = html;
  } catch (e) {
    if (token === recsToken) box.innerHTML = `<div class="error">Не удалось загрузить данные. Проверь интернет и попробуй ещё раз.</div>`;
  }
}

/* ================================================================ выбор героя */
const picker = { side: "a", idx: 0, q: "", attr: "" };
function renderPickerPos() {
  $("#picker-pos").innerHTML = freePositions(picker.side).map(i =>
    `<button class="chip ${i === picker.idx ? "active" : ""}" data-v="${i}">${i + 1} · ${POSITIONS[i]}</button>`).join("");
}
function openPicker(side, idx) {
  picker.side = side; picker.idx = idx; picker.q = ""; picker.attr = "";
  $("#picker-search").value = "";
  $("#picker-title").textContent = side === "a" ? "🟢 Добавить союзника" : "🔴 Добавить врага";
  $("#picker-pos-wrap").hidden = false;
  renderPickerPos();
  renderPicker();
  $("#picker").classList.add("open");
  updateBack();
}
function closePicker() { $("#picker").classList.remove("open"); updateBack(); }
function renderPicker() {
  $("#picker-attrs").innerHTML = chipsHTML([["", "Все"], ...Object.entries(ATTRS)], picker.attr);
  const taken = new Set([...picked(draft.a), ...picked(draft.e)]);
  const q = norm(picker.q);
  $("#picker-grid").innerHTML = HERO_LIST.filter(h => !taken.has(h.id) &&
    (!picker.attr || h.primary_attr === picker.attr) && (!q || norm(h.localized_name).includes(q)))
    .map(h => tileHTML(h)).join("") || `<div class="muted">Ничего не найдено</div>`;
}
$("#picker-search").oninput = e => { picker.q = e.target.value; renderPicker(); };
$("#picker-attrs").onclick = e => { const c = e.target.closest(".chip"); if (c) { picker.attr = c.dataset.v; renderPicker(); } };
$("#picker-close").onclick = closePicker;
$("#picker-pos").onclick = e => { const c = e.target.closest(".chip"); if (c) { haptic(); picker.idx = +c.dataset.v; renderPickerPos(); } };
$("#add-ally").onclick = $("#add-enemy").onclick = e => {
  const side = e.currentTarget.id === "add-ally" ? "a" : "e";
  const free = freePositions(side);
  if (!free.length) return;
  haptic();
  openPicker(side, free[0]);
};
$("#picker-grid").onclick = e => {
  const t = e.target.closest(".hero-tile");
  if (!t) return;
  const id = +t.dataset.id, side = picker.side;
  if (!draft.a.includes(id) && !draft.e.includes(id)) draft[side][picker.idx] = id;
  try { tg && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  saveDraft(); closePicker(); renderDraft();
};

/* ================================================================ старт */
(async function init() {
  try {
    await loadHeroes();
    draft = normDraft(draft); saveDraft();
    renderDraft(); renderHeroes(); renderTop();
  } catch (e) {
    const msg = `<div class="error">Не удалось загрузить данные с OpenDota.<br>Проверь интернет и открой приложение заново.</div>`;
    $("#recs").innerHTML = msg; $("#hero-grid").innerHTML = msg; $("#top-list").innerHTML = msg;
  }
})();
</script>
</body>
</html>
