<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dota Draft Helper</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  /* ===================== PREMIUM GAMING — дизайн-система ===================== */
  :root {
    --bg: #07080c;
    --bg2: #0a0c11;
    --card: #11141b;
    --surface: rgba(255,255,255,.035);
    --surface-2: rgba(255,255,255,.06);
    --line: rgba(255,255,255,.08);
    --line-2: rgba(255,255,255,.14);
    --text: #eceef2;
    --hint: #8b91a1;
    --gold: #e9b949;
    --gold-2: #f8dc8e;
    --gold-dim: rgba(233,185,73,.14);
    --accent: var(--gold);
    --accent-text: #1b1405;
    --good: #34d399;
    --good-dim: rgba(52,211,153,.13);
    --bad: #f05252;
    --bad-dim: rgba(240,82,82,.13);
    --radius: 14px;
    --display: "Exo 2", "Segoe UI", system-ui, sans-serif;
    --body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html, body { margin: 0; color: var(--text); font: 15px/1.4 var(--body); -webkit-font-smoothing: antialiased; }
  body {
    min-height: 100vh; padding-bottom: calc(78px + env(safe-area-inset-bottom));
    background:
      radial-gradient(900px 420px at 0% -8%, rgba(233,185,73,.13), transparent 60%),
      radial-gradient(700px 380px at 110% 0%, rgba(240,82,82,.10), transparent 60%),
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px) 0 0 / 100% 28px,
      linear-gradient(180deg, var(--bg2), var(--bg));
    background-attachment: fixed;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  input { font: inherit; }
  ::selection { background: var(--gold-dim); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes sheetUp { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ---- нижняя навигация ---- */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
    background: rgba(9,11,15,.82); -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
    border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); }
  nav.tabs button { position: relative; flex: 1; padding: 8px 0 4px; color: var(--hint);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font: 600 11px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; transition: color .2s; }
  nav.tabs button .ico { width: 22px; height: 22px; display: block; }
  nav.tabs button .ico svg { width: 22px; height: 22px; }
  nav.tabs button.active { color: var(--gold); }
  nav.tabs button.active::before { content: ""; position: absolute; top: -7px; left: 50%; width: 28px; height: 2px;
    transform: translateX(-50%); border-radius: 2px; background: linear-gradient(90deg, var(--gold-2), var(--gold));
    box-shadow: 0 0 12px rgba(233,185,73,.8); }
  nav.tabs button.active .ico { filter: drop-shadow(0 0 6px rgba(233,185,73,.55)); }

  .view { display: none; padding: 14px 14px 8px; }
  .view.active { display: block; animation: fadeUp .28s ease both; }
  .eyebrow { font: 700 10px/1 var(--display); letter-spacing: .28em; text-transform: uppercase; color: var(--gold);
    margin: 4px 2px 6px; display: flex; align-items: center; gap: 8px; }
  .eyebrow::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(233,185,73,.5), transparent); }
  h1 { font: 800 25px/1.1 var(--display); letter-spacing: .01em; margin: 0 2px 14px;
    background: linear-gradient(180deg, #fff 30%, #c9ccd4); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { font: 700 11.5px/1 var(--display); text-transform: uppercase; letter-spacing: .16em; color: var(--hint);
    margin: 22px 2px 10px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: var(--gold);
    box-shadow: 0 0 8px rgba(233,185,73,.6); flex-shrink: 0; }
  h2.ally::before { background: var(--good); box-shadow: 0 0 8px rgba(52,211,153,.7); }
  h2.enemy::before { background: var(--bad); box-shadow: 0 0 8px rgba(240,82,82,.7); }
  .muted { color: var(--hint); font-size: 13px; }
  .card { position: relative; border-radius: var(--radius); padding: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.018)), var(--card);
    border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 10px 30px rgba(0,0,0,.35); }

  /* ---- поиск и фильтры ---- */
  .search { width: 100%; padding: 12px 14px; border-radius: 12px; outline: 0; color: var(--text); margin-bottom: 12px;
    background: var(--surface); border: 1px solid var(--line); transition: border-color .2s, box-shadow .2s; }
  .search:focus { border-color: rgba(233,185,73,.55); box-shadow: 0 0 0 3px rgba(233,185,73,.12); }
  .search::placeholder { color: var(--hint); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); transition: all .2s; }
  .chip.active { color: var(--accent-text); font-weight: 700; border-color: transparent;
    background: linear-gradient(135deg, var(--gold-2), var(--gold)); box-shadow: 0 4px 16px rgba(233,185,73,.28); }

  /* ---- сетка героев ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .hero-tile { position: relative; border-radius: 12px; overflow: hidden; text-align: left;
    background: var(--card); border: 1px solid var(--line); transition: transform .15s, border-color .2s; }
  .hero-tile:active { transform: scale(.97); border-color: rgba(233,185,73,.5); }
  .hero-tile img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
  .hero-tile .nm { font: 600 12px/1.2 var(--display); padding: 6px 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-tile .wr { font-size: 11px; font-weight: 600; padding: 2px 8px 7px; font-variant-numeric: tabular-nums; }
  .good { color: var(--good); } .bad { color: var(--bad); }

  /* ---- карточка героя ---- */
  .hero-head { position: relative; border-radius: 16px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--line);
    box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .hero-head img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .hero-head::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent); box-shadow: 0 0 14px rgba(233,185,73,.7); }
  .hero-head .over { position: absolute; inset: auto 0 0 0; padding: 48px 16px 14px; color: #fff;
    background: linear-gradient(transparent, rgba(7,8,12,.55) 35%, rgba(7,8,12,.95)); }
  .hero-head .over .t { font: 800 28px/1.05 var(--display); letter-spacing: .01em; text-shadow: 0 2px 16px rgba(0,0,0,.6); }
  .hero-head .over .s { font-size: 12px; color: var(--gold-2); opacity: .9; margin-top: 4px; letter-spacing: .02em; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat .v { font: 800 22px/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--hint); margin-top: 2px; }
  .items { display: flex; flex-wrap: wrap; gap: 8px; }
  .item { width: 60px; text-align: center; font-size: 10.5px; line-height: 1.2; color: var(--hint); transition: transform .12s; }
  .item:active { transform: scale(.94); }
  .item img { width: 60px; height: 44px; border-radius: 8px; object-fit: cover; display: block; background: #000;
    margin-bottom: 3px; border: 1px solid var(--line-2); box-shadow: 0 4px 12px rgba(0,0,0,.45); }
  .build .st { font: 700 11.5px/1 var(--display); text-transform: uppercase; letter-spacing: .12em; color: var(--gold-2);
    margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
  .build .st:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .build .var { padding: 8px 0 10px; border-bottom: 1px dashed var(--line); }
  .build .var:last-of-type { border-bottom: 0; }
  .build .vl { font-size: 12.5px; font-weight: 700; margin-bottom: 7px; }
  .build .vl span { font-weight: 400; color: var(--hint); }
  .build .item .ic { position: relative; display: block; }
  .build .item .cnt { position: absolute; right: 3px; bottom: 5px; background: rgba(0,0,0,.8); color: var(--gold-2);
    font: 700 10px/1 var(--display); padding: 2px 4px; border-radius: 4px; }
  .build .item .sub { display: block; font-size: 10px; color: var(--good); margin-top: 1px; font-weight: 600; }
  .build .why, .ctr .why { font-size: 12px; color: var(--hint); margin-top: 6px; line-height: 1.45; }
  .ctr { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .ctr:last-child { border-bottom: 0; }
  .ctr img { width: 50px; height: 36px; border-radius: 7px; object-fit: cover; background: #000; flex-shrink: 0; }
  .ctr .why { margin-top: 2px; }
  .bal { display: flex; gap: 12px; align-items: flex-start; padding: 9px 8px; margin: 0 -8px; border-radius: 10px;
    border-bottom: 1px solid var(--line); transition: background .15s; }
  .bal:last-of-type { border-bottom: 0; }
  .bal:active { background: var(--surface-2); }
  .bal img { width: 52px; height: 38px; border-radius: 8px; object-fit: cover; background: #000; flex-shrink: 0;
    border: 1px solid var(--line-2); box-shadow: 0 4px 12px rgba(0,0,0,.45); }
  .bal .bt { min-width: 0; }
  .bal .bt > b { font-weight: 700; }
  .bal .tm { font: 600 11px/1 var(--display); color: var(--gold-2); background: var(--gold-dim); padding: 2px 6px;
    border-radius: 5px; margin-left: 4px; vertical-align: 1px; }
  .bal .tag { font-size: 12px; margin-top: 3px; line-height: 1.35; }
  .bal .tp { color: var(--hint); }
  .bal .tc { color: var(--bad); font-weight: 500; }
  .bal .ti { color: var(--text); opacity: .78; }
  .bal .tx { color: var(--good); }
  .bal .twhy { color: var(--gold-2); opacity: .92; }
  /* прокачка и таланты */
  .st-n { color: var(--hint); font-weight: 600; letter-spacing: .04em; text-transform: none; }
  .skills { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  .sk { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .sk img { width: 100%; aspect-ratio: 1; border-radius: 6px; object-fit: cover; background: #000; border: 1px solid var(--line-2); }
  .sk .lv { font: 700 9px/1 var(--display); color: var(--hint); }
  .sk .star { width: 100%; aspect-ratio: 1; display: grid; place-items: center; border-radius: 6px; font-size: 16px;
    color: var(--gold-2); background: var(--gold-dim); border: 1px solid rgba(233,185,73,.4); }
  .sk .pc { font-size: 9px; color: var(--hint); }
  .tal-row { display: flex; gap: 10px; align-items: stretch; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .tal-row:last-of-type { border-bottom: 0; }
  .tal-row .tl { width: 30px; flex-shrink: 0; display: grid; place-items: center; border-radius: 8px;
    font: 800 13px/1 var(--display); color: var(--gold-2); background: var(--gold-dim); }
  .tal-opts { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tal-opt { padding: 6px 8px; border-radius: 8px; font-size: 11.5px; line-height: 1.3; background: var(--surface);
    border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  .tal-opt b { font: 800 13px/1 var(--display); color: var(--hint); }
  .tal-opt i { font-style: normal; font-size: 10.5px; color: var(--hint); }
  .tal-opt.best { border-color: rgba(233,185,73,.55); background: var(--gold-dim); }
  .tal-opt.best b { color: var(--gold-2); }
  .build .sub-st { font: 700 11px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--hint);
    margin: 10px 0 2px; padding: 6px 8px; border-radius: 6px; background: var(--surface); display: inline-block; }
  .bal .tidle { color: var(--hint); font-style: italic; }
  .build .legend { margin-top: 12px; font-size: 11px; padding-top: 10px; border-top: 1px solid var(--line); }

  /* ---- значки на иконках предметов и карточка предмета ---- */
  .item[data-k], .bal[data-k] { cursor: pointer; }
  .item .ic { position: relative; display: block; }
  .ibadge { position: absolute; left: 3px; top: 3px; font-style: normal; font-size: 10px; line-height: 1;
    background: rgba(0,0,0,.78); border-radius: 5px; padding: 2px 3px; border: 1px solid var(--line-2); }
  .ibadge.need { border-color: rgba(240,82,82,.6); box-shadow: 0 0 8px rgba(240,82,82,.45); }
  #item-card { position: fixed; inset: 0; z-index: 40; background: rgba(3,4,7,.62); display: none;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); align-items: flex-end; justify-content: center; }
  #item-card.open { display: flex; }
  #item-card .sheet { position: relative; width: 100%; max-width: 520px; padding: 22px 18px calc(22px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(233,185,73,.08), transparent 120px), #10131a;
    border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; font-size: 14px; line-height: 1.5;
    box-shadow: 0 -20px 60px rgba(0,0,0,.6); animation: sheetUp .22s ease both; }
  #item-card .sheet::before { content: ""; position: absolute; top: 8px; left: 50%; width: 38px; height: 4px;
    transform: translateX(-50%); border-radius: 4px; background: var(--line-2); }
  #item-card .ic-close { position: absolute; right: 14px; top: 14px; width: 30px; height: 30px; border-radius: 50%;
    font-size: 15px; color: var(--hint); background: var(--surface-2); }
  .ic-head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .ic-head img { width: 70px; height: 50px; border-radius: 10px; object-fit: cover; background: #000;
    border: 1px solid rgba(233,185,73,.4); box-shadow: 0 0 18px rgba(233,185,73,.25); }
  .ic-head b { font: 800 19px/1.15 var(--display); }
  .ic-what { margin-bottom: 10px; }
  .ic-need { color: var(--bad); font-weight: 600; background: var(--bad-dim); border: 1px solid rgba(240,82,82,.3);
    border-radius: 10px; padding: 8px 10px; }
  .ic-idle { color: var(--hint); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .ic-core { color: var(--good); background: var(--good-dim); border: 1px solid rgba(52,211,153,.28); border-radius: 10px; padding: 8px 10px; }
  .ic-into { margin-top: 10px; color: var(--hint); }

  .guide-btn { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; width: 100%; margin: 0 0 6px; padding: 12px 14px;
    border-radius: 12px; text-align: left; font: 700 14px/1.2 var(--display); letter-spacing: .02em; color: var(--gold-2);
    border: 1px solid transparent;
    background: linear-gradient(var(--card), var(--card)) padding-box,
                linear-gradient(135deg, rgba(233,185,73,.75), rgba(233,185,73,.08) 60%) border-box;
    transition: transform .12s, box-shadow .2s; }
  .guide-btn:active { transform: scale(.98); box-shadow: 0 0 18px rgba(233,185,73,.25); }
  .guide-btn span { font: 400 12px/1.2 var(--body); color: var(--hint); letter-spacing: 0; }
  details.alt { margin-top: 12px; }
  details.alt > .build { margin-top: 8px; }
  details.pro-items { margin-top: 18px; }
  details.pro-items summary { cursor: pointer; padding: 13px 14px; border-radius: 12px; list-style: none;
    font: 700 13.5px/1.2 var(--display); letter-spacing: .02em;
    background: var(--surface); border: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  details.pro-items summary::-webkit-details-marker { display: none; }
  details.pro-items summary::after { content: "▾"; color: var(--gold); transition: transform .2s; }
  details.pro-items[open] summary::after { transform: rotate(180deg); }
  .mu { display: flex; flex-direction: column; gap: 4px; }
  .mu-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 5px 6px; margin: 0 -6px; border-radius: 8px; }
  .mu-row:active { background: var(--surface-2); }
  .mu-row img { width: 50px; height: 28px; border-radius: 6px; object-fit: cover; background: #000; border: 1px solid var(--line); }
  .mu-row .nm { flex: 1; font-weight: 500; }
  .mu-row .val { font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; }
  .mu-row .g { font-size: 11px; color: var(--hint); width: 48px; text-align: right; }

  .match-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .match-row:last-child { border-bottom: 0; }
  .match-row .res { width: 86px; font: 700 12px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; }
  .match-row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 13px; }
  .match-row .mid span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match-row .mid .muted { font-size: 11px; }
  .match-row .kda { font: 700 13px/1 var(--display); font-variant-numeric: tabular-nums; }

  /* ---- топ ---- */
  .top-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
  .top-row:last-child { border-bottom: 0; }
  .top-row .rk { width: 24px; font: 800 14px/1 var(--display); color: var(--hint); text-align: right; font-variant-numeric: tabular-nums; }
  .top-row:nth-child(1) .rk { color: var(--gold-2); text-shadow: 0 0 10px rgba(233,185,73,.6); }
  .top-row:nth-child(2) .rk { color: #d7dbe3; }
  .top-row:nth-child(3) .rk { color: #d9a173; }
  .top-row img { width: 58px; height: 33px; border-radius: 7px; object-fit: cover; background: #000; border: 1px solid var(--line); }
  .top-row .mid { flex: 1; min-width: 0; }
  .bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.07); margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--good), #7ff0c2);
    box-shadow: 0 0 8px rgba(52,211,153,.6); }

  /* ---- драфт ---- */
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .slot { aspect-ratio: 16/11; border-radius: 10px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--hint);
    background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015));
    box-shadow: inset 0 0 0 1px var(--line); transition: transform .12s, box-shadow .2s; }
  .slot:active { transform: scale(.95); }
  .slot.empty { box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 6px, transparent 6px 12px),
      linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)); }
  .slot.filled { box-shadow: inset 0 0 0 1.5px var(--line-2); }
  .slot.ally.filled { box-shadow: inset 0 0 0 1.5px var(--good), 0 0 16px rgba(52,211,153,.32); }
  .slot.enemy.filled { box-shadow: inset 0 0 0 1.5px var(--bad), 0 0 16px rgba(240,82,82,.32); }
  .add-ally { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 10px; padding: 12px;
    border-radius: 12px; font: 700 13px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--good);
    border: 1px solid rgba(52,211,153,.4); background: linear-gradient(90deg, rgba(52,211,153,.14), rgba(52,211,153,.03));
    transition: transform .12s, box-shadow .2s; }
  .add-ally:active { transform: scale(.98); box-shadow: 0 0 20px rgba(52,211,153,.3); }
  .add-ally .pl { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px;
    font-size: 16px; line-height: 1; background: rgba(52,211,153,.2); }
  .add-ally[hidden] { display: none; }
  .add-enemy { color: var(--bad); border-color: rgba(240,82,82,.4); background: linear-gradient(90deg, rgba(240,82,82,.14), rgba(240,82,82,.03)); }
  .add-enemy:active { box-shadow: 0 0 20px rgba(240,82,82,.3); }
  .add-enemy .pl { background: rgba(240,82,82,.2); }
  #picker-pos-wrap[hidden] { display: none; }
  #picker-pos-wrap .lbl { font-size: 12px; color: var(--hint); margin-bottom: 6px; }
  .slot.me { background: linear-gradient(180deg, rgba(233,185,73,.2), rgba(233,185,73,.05));

// fetch с ограничением по времени: OpenDota иногда не отвечает минутами — не ждём его вечно
async function fetchT(url, ms, opts = {}) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, { ...opts, signal: ctl.signal }); }
  finally { clearTimeout(timer); }
}
const delay = ms => new Promise(r => setTimeout(r, ms));

/* Копия данных OpenDota, которую сервер кладёт рядом с приложением (mirror.py): герои, матчапы,
   синергия. Берём её первой — быстро и не зависит от падений OpenDota; если её нет — идём в OpenDota. */
const mirrorLoad = {};
function mirror(name) {
  if (!mirrorLoad[name]) {
    mirrorLoad[name] = fetchT(`mirror/${name}?h=${Math.floor(Date.now() / 3600e3)}`, 12000)
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .catch(e => { delete mirrorLoad[name]; throw e; });
  }
  return mirrorLoad[name];
}
async function fromMirror(path) {
  if (path === "/heroStats") {
    const d = await mirror("herostats.json");
    if (Array.isArray(d) && d.length > 100) return d;
  }
  const m = path.match(/^\/heroes\/(\d+)\/matchups$/);
  if (m) {
    const rows = ((await mirror("matchups.json")).heroes || {})[m[1]];
    if (rows && rows.length) return rows.map(([hero_id, games_played, wins]) => ({ hero_id, games_played, wins }));
  }
  const ip = path.match(/^\/heroes\/(\d+)\/itemPopularity$/);
  if (ip) {
    const pop = ((await mirror("itempop.json")).heroes || {})[ip[1]];
    if (pop && Object.keys(pop).length) return pop;
  }
  if (path === "/constants/items") {
    // тот же справочник OpenDota, но с GitHub (через jsDelivr) — не зависит от падений api.opendota.com
    const r = await fetchT("https://cdn.jsdelivr.net/gh/odota/dotaconstants@master/build/items.json", 15000);
    if (r.ok) return r.json();
  }
  return null;
}

// «Предохранитель»: если OpenDota не ответил, 90 секунд к нему не ходим — сразу берём то, что есть
let odDownUntil = 0;
async function api(path, ttl, timeout = 8000) {
  const now = Date.now();
  const hit = mem[path] || lsGet("od:" + path);
  if (hit && now - hit.t < ttl) return (mem[path] = hit).data;
  const keep = data => { mem[path] = { t: now, data }; lsSet("od:" + path, mem[path]); return data; };
  const slowOk = path.startsWith("/explorer");   // Explorer бывает медленным и при живом OpenDota
  try {
    const m = await fromMirror(path);
    if (m) return keep(m);
  } catch (e) { /* копии нет — идём в OpenDota */ }
  try {
    if (Date.now() < odDownUntil) throw new Error("OpenDota недоступен");
    const r = await fetchT(API + path, timeout);
    if (!r.ok) {
      if ((r.status >= 500 || r.status === 429) && !slowOk) odDownUntil = Date.now() + 90e3;
      throw new Error("HTTP " + r.status);
    }
    return keep(await r.json());
  } catch (err) {
    if ((err.name === "AbortError" || err instanceof TypeError) && !slowOk) odDownUntil = Date.now() + 90e3;
    if (hit) return hit.data;            // OpenDota не ответил — отдадим старые данные
    throw err;
  }
}

// подходит ли герой под поисковый запрос: английское имя, английские прозвища OpenDota, русские имена и сленг
// 0 — точное совпадение с именем/сленгом, 1 — начало слова, 2 — внутри слова, 9 — не подходит
function heroMatchRank(h, q) {
  if (!q) return 0;
  const ru = (RU_ALIASES[h.localized_name] || "").split(" ");
  const en = Array.isArray(h.aliases) ? h.aliases : String(h.aliases || "").split(",");
  let best = 9;
  for (const n of [h.localized_name, ...en, ...ru]) {
    const s = norm(n);
    if (!s) continue;
    if (s === q) return 0;
    if (s.startsWith(q)) best = Math.min(best, 1);
    else if (q.length >= 3 && s.includes(q)) best = Math.min(best, 2);
  }
  return best;
}
const heroMatches = (h, q) => heroMatchRank(h, q) < 9;
// при поиске сначала точные совпадения («па» → Phantom Assassin), потом остальные
const byMatch = (list, q) => q ? list.slice().sort((a, b) => heroMatchRank(a, q) - heroMatchRank(b, q)) : list;

    <div class="nm">${esc(h.localized_name)}</div>
    <div class="wr ${wrClass(hi)}">${hi == null ? "—" : hi.toFixed(1) + "%"}${extra}</div>
  </button>`;
}
function chipsHTML(opts, active) {
  return opts.map(([v, t]) => `<button class="chip ${v === active ? "active" : ""}" data-v="${v}">${t}</button>`).join("");
}

// Нужен ли ситуативный предмет в этом драфте и почему — для новичков
function itemDraftNote(key, enemies) {
  const g = ITEM_GUIDE[key];
  if (!g) return null;
  if (!g.tags || !g.tags.length) return { what: g.what, need: [], idle: "", core: true, start: !!g.start };   // основной / стартовый
  const who = [];
  for (const tag of g.tags) {
    for (const e of enemies) {
      if (!(THREAT_SETS[tag] && THREAT_SETS[tag].has(e.localized_name))) continue;
      const label = tag === "targeted" ? `${e.localized_name} (${TARGETED[e.localized_name]})` : e.localized_name;
      if (!who.some(w => w.startsWith(e.localized_name))) who.push(label);   // один герой — одно упоминание
    }
  }
  const need = who.length ? [`нужен против ${who.join(", ")}`] : [];
  const examples = tag => (tag === "targeted" ? ["Spirit Breaker", "Lion", "Doom"] : THREATS[tag].slice(0, 3)).join(", ");
  const idle = `Ситуативный: берут против ${g.tags.map(t => `${TAG_TEXT[t]} (${examples(t)})`).join(" или ")}.` +
    (enemies.length ? " В этом драфте таких нет — можно заменить на другой предмет." : " Добавь врагов — скажу, нужен ли он.");
  return { what: g.what, need, idle };
}

// Ответ на угрозу: какой предмет брать на каждой позиции (p — 0..4, h — твой герой).
const melee = h => h.attack_type === "Melee";
// бьёт с руки (а не кастер): ловкачи и силовые коры. Инвокеру/Штормe/Тинкеру предметы на атаку не нужны.
// Оффлейнерам (Акс, Марс…) предметы на атаку не советуем, даже если OpenDota пишет им роль Carry.
const attacker = (h, p) => p <= 2 && (h.primary_attr === "agi" ||
  ((h.primary_attr === "str" || h.primary_attr === "all") && (p === 0 || (p === 1 && has(h, "Carry")))));
const COUNTERS = [
  { tag: "magic", min: 2, why: "много магического урона",
    item: (p, h) => ["black_king_bar", "black_king_bar", "pipe", "glimmer_cape", "glimmer_cape"][p] },
  { tag: "disable", min: 2, why: "много контроля",
    item: (p, h) => ["black_king_bar", "black_king_bar", "black_king_bar", "lotus_orb", "force_staff"][p] },
  { tag: "physical", min: 2, why: "сильные физические коры",
    item: (p, h) => p <= 1
      ? (!attacker(h, p) ? (h.primary_attr === "str" ? "blade_mail" : "shivas_guard")
        : h.primary_attr === "str" ? "satanic" : "butterfly")
      : ["crimson_guard", "solar_crest", "ghost"][p - 2] },
  { tag: "evasion", min: 1, why: "уклонение — твои атаки будут промахиваться",
    item: (p, h) => p <= 2 && attacker(h, p) ? "monkey_king_bar" : null },
  { tag: "illusions", min: 1, why: "иллюзии и призывы",
    item: (p, h) => p > 2 ? null : !attacker(h, p) ? "shivas_guard"
      : p === 0 && melee(h) ? "bfury" : p <= 1 ? "mjollnir" : "shivas_guard" },
  { tag: "invis", min: 1, why: "невидимость",
    item: (p, h) => p === 4 ? "ward_sentry" : "dust" },
  { tag: "heal", min: 1, why: "лечение и регенерация",
    item: (p, h) => p <= 1 ? (attacker(h, p) ? "skadi" : "shivas_guard") : "spirit_vessel" },
  { tag: "silence", min: 1, why: "немота",
    item: (p, h) => p <= 1 ? (h.primary_attr === "agi" ? "manta" : "black_king_bar") : p <= 3 ? "lotus_orb" : "cyclone" },
  { tag: "mobile", min: 1, why: "мобильные, убегают",
    item: (p, h) => p <= 1 && !attacker(h, p) ? (p === 1 ? "orchid" : "sheepstick")
      : p === 0 ? (melee(h) ? "abyssal_blade" : "bloodthorn") : p === 1 ? "orchid" : "rod_of_atos" },
  { tag: "passive", min: 1, why: "сильные пассивки — Break их отключит",
    item: (p, h) => p <= 2 && attacker(h, p) ? "silver_edge" : null },
  { tag: "targeted", min: 2, why: "много опасных заклинаний в одну цель",
    item: (p, h) => p <= 1 ? "sphere" : p <= 3 ? "lotus_orb" : null },
];

  const start = [
    ["tango", "flask", "branches", "branches", ...(melee(h) ? ["quelling_blade"] : []), ATTR_ITEM[attr]],
    ["tango", "faerie_fire", "branches", "branches", ATTR_ITEM[attr]],
    ["tango", "flask", "branches", ...(melee(h) ? ["quelling_blade"] : []), "ring_of_protection"],
    ["tango", "blood_grenade", "ward_observer", "branches", "branches", "faerie_fire"],
    ["tango", "flask", "ward_observer", "ward_sentry", "clarity", "branches"],
  ][p];
  const boots = p === 0 ? "power_treads"
    : p === 1 ? (attr === "int" ? "arcane_boots" : "power_treads")
    : p === 2 ? (melee(h) ? "phase_boots" : attr === "int" ? "arcane_boots" : "power_treads")
    : p === 3 ? "tranquil_boots" : "arcane_boots";
  const early = [
    [ATTR_BRACER[attr], "magic_wand", boots],
    ["bottle", "magic_wand", boots],
    ["magic_wand", ATTR_BRACER[attr], boots],
    ["magic_wand", "wind_lace", boots],
    ["magic_wand", "wind_lace", boots],
  ][p];
  return { start, early, spamNote: spam.length ? `Волшебная палочка обязательна: ${spam.join(", ")} часто кастуют` : "" };
}

// Анализ драфта: что брать против этих врагов на этой позиции
function draftCounters(p, h) {
  const enemies = picked(draft.e).map(id => HEROES[id]).filter(Boolean);
  const allies = picked(draft.a).map(id => HEROES[id]).filter(Boolean);
  const out = new Map();   // ключ предмета -> { key, reasons: [] }
  const add = (key, reason) => {
    if (!key) return;
    if (!out.has(key)) out.set(key, { key, reasons: [] });
    out.get(key).reasons.push(reason);
  };
  const hits = COUNTERS.map(c => ({ c, who: enemies.filter(e => THREAT_SETS[c.tag].has(e.localized_name)) }))
    .filter(x => x.who.length >= x.c.min)
    .sort((a, b) => b.who.length - a.who.length);
  for (const { c, who } of hits) add(c.item(p, h), `${c.why}: ${who.map(e => e.localized_name).join(", ")}`);
  // союзники: если в команде некому начинать драки — инициатором будешь ты
  if ((p === 2 || p === 3) && allies.length >= 2 && !allies.some(a => has(a, "Initiator")))
    add("blink", "в твоей команде нет инициатора — начинать драки придётся тебе");
  const spam = enemies.filter(e => THREAT_SETS.spam.has(e.localized_name)).map(e => e.localized_name);
  return { list: [...out.values()].slice(0, 6), enemies, spam };
}

// эти предметы — части других, но их часто берут как готовые
const CORE_OK_PARTS = new Set(["blink", "force_staff", "aether_lens", "orchid", "dragon_lance", "diffusal_blade"]);
const ITEM_BY_KEY = () => Object.fromEntries(Object.values(ITEMS).map(it => [it.key, it]));
// предметы одной строкой; повторы (2 ветки) — одной иконкой с «×2»; subs — подпись под иконкой
function buildItemsHTML(keys, byKey, subs = {}) {
  const counts = new Map();
  for (const k of keys) if (byKey[k]) counts.set(k, (counts.get(k) || 0) + 1);
  return `<div class="items">${[...counts].map(([k, n]) => { const it = byKey[k]; return `<div class="item" data-k="${esc(k)}" title="${esc(it.dname)}">
    <span class="ic"><img loading="lazy" src="${it.img ? CDN + it.img : ""}" alt="">${n > 1 ? `<b class="cnt">×${n}</b>` : ""}${itemBadge(k)}</span>
    ${esc(it.dname)}${subs[k] ? `<span class="sub">${subs[k]}</span>` : ""}</div>`; }).join("")}</div>`;
}

/* ---- пояснения к предметам: значок на иконке и карточка по нажатию ---- */
const draftEnemies = () => picked(draft.e).map(id => HEROES[id]).filter(Boolean);
// 🎯 — предмет нужен против этих врагов, 💡 — ситуативный и в этом драфте не нужен
function itemBadge(k) {
  const enemies = draftEnemies();
  const note = itemDraftNote(k, enemies);
  if (!note || note.core) return "";
  if (note.need.length) return `<i class="ibadge need" title="нужен в этом драфте">🎯</i>`;
  return enemies.length ? `<i class="ibadge idle" title="в этом драфте можно не брать">💡</i>` : "";
}
// во что собирается предмет: { ключ: [названия больших предметов] }
let USED_IN = null;
function usedInItems(k) {
  if (!USED_IN) {
    USED_IN = {};
    for (const it of Object.values(ITEMS))
      if (!it.key.startsWith("recipe_")) for (const c of new Set(it.components || [])) (USED_IN[c] = USED_IN[c] || []).push(it);
  }
  return (USED_IN[k] || []).slice().sort((a, b) => (a.cost || 0) - (b.cost || 0));
}
function usedIn(k) {
  return usedInItems(k).map(it => it.dname).filter((n, i, a) => a.indexOf(n) === i);
}
function openItemCard(k) {
  const it = ITEM_BY_KEY()[k];
  if (!it) return;
  const enemies = draftEnemies();
  const note = itemDraftNote(k, enemies);
  const into = usedIn(k);
  // для предметов без нашего описания — характеристики и способность прямо из данных игры (на английском)
  const stats = (it.attrib || []).filter(a => a.display && a.value != null)
    .map(a => a.display.replace("{value}", a.value)).slice(0, 4);
  const abil = (it.abilities || []).map(a => `${a.title}: ${a.description}`).slice(0, 1);
  const auto = !note && (stats.length || abil.length)
    ? `<div class="ic-what">📋 ${[stats.map(esc).join(" · "), ...abil.map(esc)].filter(Boolean).join("<br>")}
       <div class="muted">(описание из данных игры)</div></div>` : "";
  const verdict = !note ? (into.length
      ? `${auto}<div class="ic-what">🔩 Это деталь — её покупают по пути к большому предмету.</div>`
      : auto || `<div class="muted">Для этого предмета пояснения пока нет.</div>`)
    : note.start ? `<div class="ic-core">🛒 Стартовый предмет — покупают в начале игры, до выхода на линию или в первые минуты.</div>`
    : note.core ? `<div class="ic-core">✅ Основной предмет — его берут почти в каждой игре, не зависит от врагов.</div>`
    : note.need.length ? note.need.map(w => `<div class="ic-need">🎯 ${esc(w)}</div>`).join("")
    : `<div class="ic-idle">💡 ${esc(note.idle)}</div>`;
  $("#item-card-body").innerHTML = `
    <div class="ic-head"><img src="${it.img ? CDN + it.img : ""}" alt=""><div><b>${esc(it.dname)}</b>
      ${it.cost ? `<div class="muted">${fmt(it.cost)} золота</div>` : ""}</div></div>
    ${note ? `<div class="ic-what">ℹ️ ${esc(note.what)}</div>` : ""}
    ${verdict}
    ${into.length ? `<div class="ic-into">⬆️ Потом собирается в: ${into.slice(0, 5).map(esc).join(", ")}${into.length > 5 ? " и др." : ""}</div>` : ""}
    ${enemies.length ? `<div class="muted" style="margin-top:8px">Враги в драфте: ${enemies.map(e => esc(e.localized_name)).join(", ")}</div>` : ""}`;
  $("#item-card").classList.add("open");
  haptic();
}
function closeItemCard() { $("#item-card").classList.remove("open"); }
document.addEventListener("click", e => {
  if (e.target.closest("#item-card .sheet")) return;
  if (e.target.closest("#item-card")) return closeItemCard();          // тап по затемнению — закрыть
  const el = e.target.closest(".item[data-k], .bal[data-k]");
  if (el) { e.stopPropagation(); openItemCard(el.dataset.k); }
}, true);

/* ---- варианты билдов: только про (itemPopularity + starts.json), без обычных пабликов ---- */
const BOOT_KEYS = ["power_treads", "phase_boots", "arcane_boots", "tranquil_boots", "boots"];
const LANE_BASICS = new Set(["tango", "flask", "branches", "faerie_fire", "clarity", "enchanted_mango",
  "ward_observer", "ward_sentry", "ward_dispenser", "blood_grenade"]);
const START_GOLD = 600;

// когда про-игроки покупают предметы на этом герое: { item: { g: игр, t: средняя минута } } из starts.json
function proTiming(heroId) {
  const src = ((STARTS || {}).timing || {})[heroId] || {};
  const s = {};
  for (const [k, [g, t]] of Object.entries(src)) s[k] = { g, t };
  return s;
}
const proRows = stage => Object.entries(stage || {}).map(([id, n]) => ({ it: ITEMS[id], n }))
  .filter(r => r.it && !r.it.key.startsWith("recipe_")).sort((a, b) => b.n - a.n);
const sameItems = (a, b) => a.slice().sort().join() === b.slice().sort().join();
const uniqVariants = vs => vs.filter((v, i) => v.items.length && !vs.slice(0, i).some(o => sameItems(o.items, v.items)));

/* ---- реальные стартовые закупы: starts.json (собирает collect_starts.py) ---- */
let STARTS = null;
async function loadStarts() {
  if (STARTS) return STARTS;
  try {
    const r = await fetch("starts.json", { cache: "no-cache" });
    STARTS = r.ok ? await r.json() : {};
  } catch (e) { STARTS = {}; }
  return STARTS;
}
const LADDER_WEIGHT = 0.35;   // вес пабов про/топ-ладдера относительно турнирных игр при выборе стартов
const SUPPORT_START = new Set(["ward_observer", "ward_sentry", "ward_dispenser", "blood_grenade", "smoke_of_deceit"]);
const START_ORDER = ["tango", "flask", "faerie_fire", "enchanted_mango", "clarity", "branches"];
// порядок показа: сначала «характерные» предметы (топорик, цирклеты…), потом расходка
const sortStart = items => items.slice().sort((a, b) => {
  const ia = START_ORDER.indexOf(a), ib = START_ORDER.indexOf(b);
  if (ia < 0 && ib < 0) return a.localeCompare(b);
  if (ia < 0) return -1; if (ib < 0) return 1;
  return ia - ib;
});

// 3 заметно разных стартовых набора — только про: турнирные матчи и игры про-игроков вне турниров
function realStartVariants(heroId, p, byKey) {
  const data = STARTS || {};
  const pro = (data.pro || {})[heroId], pub = (data.propub || {})[heroId];
  if (!pro && !pub) return null;
  // варды, смок и даст покупают «на команду» в разных сочетаниях — при сравнении наборов их не учитываем
  const TEAM = new Set(["ward_observer", "ward_sentry", "ward_dispenser", "smoke_of_deceit", "dust"]);
  const cand = new Map();
  const addSrc = (src, name) => {
    if (!src) return;
    for (const [items, n, w] of src.sets) {
      const all = items.split(",");
      const own = all.filter(k => !TEAM.has(k));
      if (!own.length) continue;
      const key = own.join(",");
      const c = cand.get(key) || { items: own, sup: false, team: false, pro: null, pub: null };
      // саппортский старт — гранатка или сентри. Один Observer Ward мидеры тоже часто берут себе
      c.sup = c.sup || all.some(k => k === "blood_grenade" || k === "ward_sentry" || k === "ward_dispenser");
      c.team = c.team || all.some(k => TEAM.has(k));
      const s = c[name] || (c[name] = { n: 0, w: 0, share: 0 });
      s.n += n; s.w += w; s.share = s.n / src.total;
      cand.set(key, c);
    }
  };
  addSrc(pro, "pro"); addSrc(pub, "pub");
  let list = [...cand.values()].filter(c => Math.max(c.pro ? c.pro.n : 0, c.pub ? c.pub.n : 0) >= 2);
  // саппортские наборы (варды, грената) — для 4–5 позиции, остальные — для коров
  const isSup = c => c.sup;
  const byRole = list.filter(c => (p >= 3) === isSup(c));
  if (byRole.length) list = byRole;
  // приоритет — турнирные игры про; пабы про и топ-ладдера учитываются слабее
  // доля пабов весит меньше и только при нормальной выборке (1–2 игры дают «100%» — это шум)
  const score = c => (c.pro ? c.pro.share : 0) + LADDER_WEIGHT * (c.pub ? c.pub.share * Math.min(1, c.pub.n / 10) : 0);
  list.sort((a, b) => score(b) - score(a));
  // берём наборы, которые отличаются хотя бы двумя видами предметов
  const types = c => new Set(c.items);
  const diff = (a, b) => { const A = types(a), B = types(b); let d = 0; for (const k of A) if (!B.has(k)) d++; for (const k of B) if (!A.has(k)) d++; return d; };
  const chosen = [];
  for (const minDiff of [2, 1]) {          // сначала сильно разные; если мало — хотя бы чем-то отличающиеся
    for (const c of list) {
      if (chosen.length === 3) break;
      if (!chosen.includes(c) && chosen.every(o => diff(o, c) >= minDiff)) chosen.push(c);
    }
  }
  const stat = (s, label) => s ? `${label}: ${Math.round(s.share * 100)}% (${fmt(s.n)} игр${s.n >= 10 ? `, ${Math.round(s.w / s.n * 100)}% побед` : ""})` : "";
  return chosen.map((c, i) => ({
    label: `${["1️⃣", "2️⃣", "3️⃣"][i]} Вариант ${i + 1}`,
    note: [stat(c.pro, "🏆 турниры"), stat(c.pub, "👤 про и топ-200 Европы в пабах")].filter(Boolean).join(" · ") +
      (c.team && p >= 3 ? " · + варды/смок на команду" : ""),
    items: sortStart(c.items),
  }));
}

function startVariants(pop, lane, byKey, p) {
  // варды и смоки про-коры берут «на команду» — в личный стартовый билд их не ставим
  const skip = new Set(["ward_dispenser", "smoke_of_deceit", "dust", ...(p <= 2 ? ["ward_observer", "ward_sentry", "blood_grenade"] : [])]);
  const rows = proRows(pop.start_game_items).filter(r => !skip.has(r.it.key));
  const games = Math.max(1, ...rows.map(r => r.n));          // танго берут почти все — ≈ число игр
  const share = k => { const r = rows.find(r => r.it.key === k); return r ? Math.round(r.n / games * 100) : 0; };
  // набираем самые популярные у про предметы на стартовое золото
  const greedy = exclude => {
    let gold = START_GOLD; const out = [];
    for (const { it } of rows) if (!exclude.has(it.key) && (it.cost || 0) <= gold) { out.push(it.key); gold -= it.cost || 0; }
    while (gold >= 50 && out.filter(k => k === "branches").length < 3) { out.push("branches"); gold -= 50; }
    return out;
  };
  const special = items => items.filter(k => !LANE_BASICS.has(k));
  const note = items => { const a = special(items)[0]; return a && byKey[a] ? `${share(a)}% про берут ${byKey[a].dname}` : ""; };
  const v1 = rows.length ? greedy(new Set()) : [];
  const v2 = rows.length ? greedy(new Set(special(v1))) : [];   // без «фирменных» предметов первого варианта
  return uniqVariants([
    { label: "⭐ Чаще всего у про", note: note(v1), items: v1 },
    { label: "🔁 Другой вариант у про", note: note(v2), items: v2 },
    { label: "🧠 Под драфт и позицию", note: "", items: lane.start },
  ]);
}

function earlyVariants(pop, pub, lane, byKey) {
  const rows = proRows(pop.early_game_items);
  // сапоги часто доапгрейживают чуть позже — считаем покупки и в ранней, и в мид-игре
  const bootCount = {};
  for (const st of ["early_game_items", "mid_game_items"])
    for (const { it, n } of proRows(pop[st])) if (BOOT_KEYS.includes(it.key)) bootCount[it.key] = (bootCount[it.key] || 0) + n;
  let boots = Object.keys(bootCount).filter(k => k !== "boots");
  if (!boots.length) boots = Object.keys(bootCount);
  boots = boots.sort((a, b) => bootCount[b] - bootCount[a]).map(k => ({ it: byKey[k], n: bootCount[k] })).filter(b => b.it);
  const bootsTotal = boots.reduce((s, r) => s + r.n, 0) || 1;
  // только готовые предметы (без частей вроде Ring of Health / Void Stone)
  const parts = new Set(Object.values(ITEMS).flatMap(it => it.components || []));
  const others = rows.filter(r => !BOOT_KEYS.includes(r.it.key) && !LANE_BASICS.has(r.it.key) &&
    (!parts.has(r.it.key) || CORE_OK_PARTS.has(r.it.key)) && !CONSUMABLES.has(r.it.key) &&
    (r.it.cost || 0) >= 400 && (r.it.cost || 0) <= 2500).slice(0, 3).map(r => r.it.key);
  const vs = boots.slice(0, 3).map(b => ({ label: `👟 ${b.it.dname}`,
    note: `${Math.round(b.n / bootsTotal * 100)}% про`, items: [b.it.key, ...others] }));
  vs.push({ label: "🧠 Под драфт и позицию", note: lane.spamNote, items: lane.early });
  return uniqVariants(vs);
}

function coreVariants(pop, pub, counters, used, byKey) {
  const parts = new Set(Object.values(ITEMS).flatMap(it => it.components || []));
  const okCore = it => it && (it.cost || 0) >= 2000 && (!parts.has(it.key) || CORE_OK_PARTS.has(it.key)) &&
    !CONSUMABLES.has(it.key) && !/recipe_|boots|treads|travel|greaves/.test(it.key) && !used.has(it.key);
  const pro = {};
  for (const st of ["mid_game_items", "late_game_items"])
    for (const { it, n } of proRows(pop[st])) if (okCore(it)) pro[it.key] = (pro[it.key] || 0) + n;
  const proTop = Object.keys(pro).sort((a, b) => pro[b] - pro[a]);
  // не ставим рядом предмет и его улучшение (Blink + Swift Blink)
  const pick = list => list.slice(0, 6).filter((k, _, all) => !all.some(o => ((byKey[o] || {}).components || []).includes(k))).slice(0, 3);
  const vPro = pick(proTop);
  // второй вариант у про: без предметов первого
  const vPro2 = pick(proTop.filter(k => !vPro.includes(k)));
  const big = counters.map(c => c.key).filter(k => byKey[k] && (byKey[k].cost || 0) >= 2000).slice(0, 2);
  const vDraft = pick([...big, ...proTop.filter(k => !big.includes(k))]);
  const subs = {};
  for (const k of new Set([...vPro, ...vPro2, ...vDraft])) {
    const s = pub[k];   // время покупки у про-игроков
    if (s && s.g >= 3) subs[k] = `~${Math.round(s.t)} мин`;
  }
  return {
    subs,
    variants: uniqVariants([
      { label: "⭐ Популярно у про", note: vPro[0] ? `${byKey[vPro[0]].dname} — в ${fmt(pro[vPro[0]])} про-играх` : "", items: vPro },
      { label: "🔁 Другой путь у про", note: vPro2[0] ? `${byKey[vPro2[0]].dname} — в ${fmt(pro[vPro2[0]])} про-играх` : "", items: vPro2 },
      { label: "🧠 Под этот драфт", note: big.length ? "сначала предметы против врагов" : "", items: big.length ? vDraft : [] },
    ]),
  };
}

/* ---- итоговый билд: про + предметы под драфт, вперемешку и по времени покупки ---- */
// грубая оценка, к какой минуте позиция накопит на предмет (если нет данных паблика)

const estMinute = (it, p) => Math.round(6 + (it.cost || 0) / GPM_BY_POS[p] * 1.6);
