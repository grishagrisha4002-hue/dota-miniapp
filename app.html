<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dota Draft Helper</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #17191d);
    --bg2: var(--tg-theme-secondary-bg-color, #0f1013);
    --card: var(--tg-theme-section-bg-color, #22252b);
    --text: var(--tg-theme-text-color, #f1f2f4);
    --hint: var(--tg-theme-hint-color, #8b9099);
    --accent: var(--tg-theme-button-color, #c23c2a);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --good: #3fb76b;
    --bad: #e0574a;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  input { font: inherit; }

  /* ---- нижняя навигация ---- */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
    background: var(--bg); border-top: 1px solid rgba(127,127,127,.15);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabs button { flex: 1; padding: 6px 0; border-radius: 10px; color: var(--hint);
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; }
  nav.tabs button .ico { font-size: 20px; line-height: 1; }
  nav.tabs button.active { color: var(--accent); }

  .view { display: none; padding: 12px; }
  .view.active { display: block; }
  h1 { font-size: 22px; margin: 4px 2px 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--hint);
    margin: 18px 2px 8px; font-weight: 600; }
  .muted { color: var(--hint); font-size: 13px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 12px; }

  /* ---- поиск и фильтры ---- */
  .search { width: 100%; padding: 10px 12px; border-radius: 10px; border: 0; outline: 0;
    background: var(--card); color: var(--text); margin-bottom: 10px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px;
    scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; padding: 6px 12px; border-radius: 999px; background: var(--card);
    font-size: 13px; color: var(--text); }
  .chip.active { background: var(--accent); color: var(--accent-text); }

  /* ---- сетка героев ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .hero-tile { background: var(--card); border-radius: 10px; overflow: hidden; text-align: left; }
  .hero-tile img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #000; }
  .hero-tile .nm { font-size: 12px; padding: 5px 6px 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .hero-tile .wr { font-size: 11px; padding: 0 6px 6px; }
  .good { color: var(--good); } .bad { color: var(--bad); }

  /* ---- карточка героя ---- */
  .hero-head { position: relative; border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
  .hero-head img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .hero-head .over { position: absolute; inset: auto 0 0 0; padding: 30px 12px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); color: #fff; }
  .hero-head .over .t { font-size: 22px; font-weight: 700; }
  .hero-head .over .s { font-size: 12px; opacity: .8; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat .v { font-size: 20px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--hint); }
  .items { display: flex; flex-wrap: wrap; gap: 8px; }
  .item { width: 58px; text-align: center; font-size: 11px; color: var(--hint); }
  .item img { width: 58px; height: 42px; border-radius: 6px; object-fit: cover; display: block;
    background: #000; margin-bottom: 2px; }
  .build .st { font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  .build .st:first-child { margin-top: 0; }
  .build .why, .ctr .why { font-size: 12px; color: var(--hint); margin-top: 4px; }
  .ctr { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0;
    border-bottom: 1px solid rgba(127,127,127,.12); }
  .ctr:last-child { border-bottom: 0; }
  .ctr img { width: 50px; height: 36px; border-radius: 6px; object-fit: cover; background: #000; flex-shrink: 0; }
  .ctr .why { margin-top: 2px; }
  details.pro-items { margin-top: 18px; }
  details.pro-items summary { cursor: pointer; padding: 12px; border-radius: var(--radius); background: var(--card);
    font-weight: 600; font-size: 14px; list-style: none; }
  details.pro-items summary::-webkit-details-marker { display: none; }
  details.pro-items summary::after { content: " ▾"; color: var(--hint); }
  details.pro-items[open] summary::after { content: " ▴"; }
  .mu { display: flex; flex-direction: column; gap: 6px; }
  .mu-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; }
  .mu-row img { width: 48px; height: 27px; border-radius: 4px; object-fit: cover; background: #000; }
  .mu-row .nm { flex: 1; }
  .mu-row .val { font-weight: 600; font-size: 14px; }
  .mu-row .g { font-size: 11px; color: var(--hint); width: 44px; text-align: right; }

  .match-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 0;
    border-bottom: 1px solid rgba(127,127,127,.12); }
  .match-row:last-child { border-bottom: 0; }
  .match-row .res { width: 82px; font-weight: 600; font-size: 13px; }
  .match-row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 13px; }
  .match-row .mid span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match-row .mid .muted { font-size: 11px; }
  .match-row .kda { font-weight: 600; font-size: 13px; }

  /* ---- топ ---- */
  .top-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; width: 100%; text-align: left;
    border-bottom: 1px solid rgba(127,127,127,.12); }
  .top-row:last-child { border-bottom: 0; }
  .top-row .rk { width: 22px; color: var(--hint); font-size: 13px; text-align: right; }
  .top-row img { width: 56px; height: 32px; border-radius: 5px; object-fit: cover; background: #000; }
  .top-row .mid { flex: 1; min-width: 0; }
  .bar { height: 4px; border-radius: 2px; background: rgba(127,127,127,.2); margin-top: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good); }

  /* ---- драфт ---- */
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .slot { aspect-ratio: 16/11; border-radius: 8px; background: var(--card); position: relative;
    overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 22px;
    color: var(--hint); border: 2px dashed rgba(127,127,127,.3); }
  .slot.filled { border: 2px solid transparent; }
  .slot.ally.filled { border-color: var(--good); }
  .slot.enemy.filled { border-color: var(--bad); }
  .add-ally { display: block; width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px;
    border: 2px dashed var(--good); color: var(--good); font-size: 15px; font-weight: 600;
    background: rgba(63,183,107,.08); text-align: center; transition: transform .1s, background .15s; }
  .add-ally:active { transform: scale(.98); background: rgba(63,183,107,.18); }
  .add-ally .pl { font-size: 20px; font-weight: 700; line-height: 1; vertical-align: -2px; margin-right: 4px; }
  .add-ally[hidden] { display: none; }
  .add-enemy { border-color: var(--bad); color: var(--bad); background: rgba(224,87,74,.08); }
  .add-enemy:active { background: rgba(224,87,74,.18); }
  #picker-pos-wrap[hidden] { display: none; }
  #picker-pos-wrap .lbl { font-size: 12px; color: var(--hint); margin-bottom: 6px; }
  .slot.me { border-style: solid; border-color: var(--good); background: rgba(127,127,127,.12); }
  .slot.empty, .slot.me { flex-direction: column; gap: 1px; line-height: 1.1; text-align: center; }
  .slot .num { font-size: 16px; font-weight: 700; color: var(--hint); }
  .slot.me .num { color: var(--text); font-size: 13px; }
  .slot .role { font-size: 10px; color: var(--hint); white-space: nowrap; }
  .slot.filled .role { position: absolute; left: 0; right: 0; bottom: 0; padding: 1px 0;
    background: rgba(0,0,0,.6); color: #fff; font-size: 9px; text-align: center; }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slot .x { position: absolute; top: 2px; right: 3px; font-size: 11px; background: rgba(0,0,0,.6);
    color: #fff; border-radius: 50%; width: 16px; height: 16px; line-height: 16px; text-align: center; }
  .rec { display: flex; gap: 10px; align-items: center; padding: 10px 0; width: 100%; text-align: left;
    border-bottom: 1px solid rgba(127,127,127,.12); }
  .rec:last-child { border-bottom: 0; }
  .rec img { width: 72px; height: 40px; border-radius: 6px; object-fit: cover; background: #000; }
  .rec .mid { flex: 1; min-width: 0; }
  .rec .nm { font-weight: 600; }
  .rec .det { font-size: 12px; color: var(--hint); }
  .rec .sc { font-weight: 700; font-size: 16px; }
  .warn { background: rgba(224,87,74,.12); color: var(--text); border-radius: 10px; padding: 10px 12px;
    font-size: 13px; margin-top: 10px; }
  .btn { display: block; width: 100%; padding: 12px; border-radius: 10px; background: var(--card);
    text-align: center; margin-top: 10px; }

  /* ---- выбор героя (оверлей) ---- */
  #picker { position: fixed; inset: 0; z-index: 30; background: var(--bg2); display: none;
    flex-direction: column; }
  #picker.open { display: flex; }
  #picker .top { padding: 12px 12px 0; background: var(--bg2); }
  #picker .top .ttl { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  #picker .top .ttl b { font-size: 18px; }
  #picker .body { flex: 1; overflow-y: auto; padding: 0 12px 20px; }

  .loading { padding: 40px 0; text-align: center; color: var(--hint); }
  .error { padding: 20px; text-align: center; color: var(--bad); }
</style>
</head>
<body>

<section class="view active" id="view-draft">
  <h1>🧠 Помощник драфта</h1>
  <h2>🟢 Твоя команда</h2>
  <div class="slots" id="ally-slots"></div>
  <p class="muted" style="margin:6px 0 0;font-size:12px">Нажми на позицию, чтобы встать на неё.</p>
  <button class="add-ally" id="add-ally"><span class="pl">+</span> Добавить союзника</button>
  <h2>🔴 Враги</h2>
  <div class="slots" id="enemy-slots"></div>
  <button class="add-ally add-enemy" id="add-enemy"><span class="pl">+</span> Добавить врага</button>
  <h2 id="recs-title">✅ Советую взять</h2>
  <div class="card" id="recs"><div class="loading">Загружаю данные…</div></div>
  <button class="btn" id="draft-reset">🗑 Сбросить драфт</button>
</section>

<section class="view" id="view-heroes">
  <h1>🦸 Герои</h1>
  <input class="search" id="hero-search" placeholder="Поиск героя…" autocomplete="off">
  <div class="chips" id="hero-attrs"></div>
  <div class="chips" id="hero-sort"></div>
  <div class="grid" id="hero-grid"><div class="loading">Загружаю героев…</div></div>
</section>

<section class="view" id="view-top">
  <h1>🏆 Топ винрейтов</h1>
  <div class="chips" id="top-mode"></div>
  <div class="card" id="top-list"><div class="loading">Загружаю…</div></div>
  <p class="muted" id="top-note"></p>
</section>

<section class="view" id="view-hero"></section>

<div id="picker">
  <div class="top">
    <div class="ttl"><b id="picker-title">Выбери героя</b><button id="picker-close">✕</button></div>
    <div id="picker-pos-wrap" hidden><div class="lbl">На какую позицию:</div><div class="chips" id="picker-pos"></div></div>
    <input class="search" id="picker-search" placeholder="Поиск героя…" autocomplete="off">
    <div class="chips" id="picker-attrs"></div>
  </div>
  <div class="body"><div class="grid" id="picker-grid"></div></div>
</div>

<nav class="tabs">
  <button data-tab="draft" class="active"><span class="ico">🧠</span>Драфт</button>
  <button data-tab="heroes"><span class="ico">🦸</span>Герои</button>
  <button data-tab="top"><span class="ico">🏆</span>Топ</button>
</nav>

<script>
/* ================================================================ настройки */
const API = "https://api.opendota.com/api";
const CDN = "https://cdn.cloudflare.steamstatic.com";
const STATS_TTL = 2 * 3600e3;       // винрейты обновляются раз в 2 часа
const BUILD_TTL = 6 * 3600e3;       // закупы и матчапы раз в 6 часов
const CONST_TTL = 24 * 3600e3;      // справочник предметов раз в сутки
const MIN_PRO_PICKS = 20, MIN_PUB_PICKS = 1000, MIN_MATCHUP_GAMES = 5;
const TOP_ITEMS = 6, TOP_SIZE = 20, DRAFT_TOP = 8;
const TEAM_SIZE = 5;
// позиции игроков: слот драфта № i — это позиция i+1
const POSITIONS = ["Керри", "Мид", "Оффлейн", "Семи-сап", "Фулл-сап"];
const DRAFT_PRIOR = 10;             // сглаживание матчапов с малым числом игр
const META_WEIGHT = 0.5;            // вес текущего винрейта на Divine+
const HIGH = [7, 8];                // Divine + Immortal

const ATTRS = { str: "💪 Сила", agi: "🏹 Ловкость", int: "🧠 Интеллект", all: "🌀 Универсал" };
// Какие герои играются на каждой позиции. Герой может быть на нескольких позициях.
// Имена — как в OpenDota (localized_name). Новых героев, которых тут нет, раскладываем по ролям.
const POSITION_HEROES = [
  // 1 Керри
  ["Alchemist", "Anti-Mage", "Arc Warden", "Bloodseeker", "Chaos Knight", "Clinkz", "Dragon Knight", "Drow Ranger",
   "Ember Spirit", "Faceless Void", "Gyrocopter", "Juggernaut", "Kez", "Lifestealer", "Lone Druid", "Luna", "Lycan",
   "Medusa", "Meepo", "Monkey King", "Morphling", "Muerta", "Naga Siren", "Nature's Prophet", "Phantom Assassin",
   "Phantom Lancer", "Razor", "Riki", "Shadow Fiend", "Slark", "Sniper", "Spectre", "Sven", "Templar Assassin",
   "Terrorblade", "Tiny", "Troll Warlord", "Ursa", "Weaver", "Wraith King"],
  // 2 Мид
  ["Arc Warden", "Batrider", "Broodmother", "Death Prophet", "Dragon Knight", "Earth Spirit", "Ember Spirit", "Huskar",
   "Invoker", "Keeper of the Light", "Kez", "Kunkka", "Leshrac", "Lina", "Lone Druid", "Magnus", "Meepo", "Monkey King",
   "Necrophos", "Outworld Destroyer", "Outworld Devourer", "Pangolier", "Primal Beast", "Puck", "Queen of Pain",
   "Razor", "Shadow Fiend", "Sniper", "Storm Spirit", "Templar Assassin", "Timbersaw", "Tinker", "Tiny", "Viper",
   "Visage", "Void Spirit", "Windranger", "Zeus"],
  // 3 Оффлейн
  ["Abaddon", "Axe", "Batrider", "Beastmaster", "Brewmaster", "Bristleback", "Broodmother", "Centaur Warrunner",
   "Clockwerk", "Dark Seer", "Dawnbreaker", "Death Prophet", "Doom", "Dragon Knight", "Enigma", "Kunkka",
   "Legion Commander", "Lycan", "Magnus", "Mars", "Necrophos", "Night Stalker", "Omniknight", "Pangolier",
   "Phoenix", "Primal Beast", "Pudge", "Razor", "Sand King", "Slardar", "Spirit Breaker", "Tidehunter", "Timbersaw",
   "Underlord", "Venomancer", "Viper", "Visage", "Windranger"],
  // 4 Семи-сап
  ["Ancient Apparition", "Bane", "Batrider", "Bounty Hunter", "Chen", "Clockwerk", "Dark Willow", "Disruptor",
   "Earth Spirit", "Earthshaker", "Elder Titan", "Enchantress", "Grimstroke", "Hoodwink", "Jakiro", "Keeper of the Light",
   "Largo", "Lina", "Lion", "Marci", "Mirana", "Nyx Assassin", "Phoenix", "Pudge", "Pugna", "Ring Master", "Rubick",
   "Shadow Demon", "Shadow Shaman", "Silencer", "Skywrath Mage", "Snapfire", "Spirit Breaker", "Techies", "Tiny",
   "Treant Protector", "Tusk", "Undying", "Vengeful Spirit", "Venomancer", "Weaver", "Windranger"],
  // 5 Фулл-сап
  ["Abaddon", "Ancient Apparition", "Bane", "Chen", "Crystal Maiden", "Dark Willow", "Dazzle", "Disruptor",
   "Elder Titan", "Enchantress", "Grimstroke", "Hoodwink", "Io", "Jakiro", "Keeper of the Light", "Largo", "Lich",
   "Lion", "Marci", "Ogre Magi", "Omniknight", "Oracle", "Phoenix", "Pugna", "Ring Master", "Rubick", "Shadow Demon",
   "Shadow Shaman", "Silencer", "Skywrath Mage", "Snapfire", "Techies", "Treant Protector", "Undying",
   "Vengeful Spirit", "Venomancer", "Warlock", "Winter Wyvern", "Witch Doctor"],
].map(list => new Set(list));
const LISTED_HEROES = new Set(POSITION_HEROES.flatMap(s => [...s]));

// запасной вариант для героев не из списка — по ролям из OpenDota
const has = (h, r) => (h.roles || []).includes(r);
const first = h => (h.roles || [])[0];
const POSITION_BY_ROLES = [
  // 1 Керри: кор с ролью Carry, не саппорт
  h => has(h, "Carry") && !has(h, "Support") && (first(h) === "Carry" || h.primary_attr === "agi"),
  // 2 Мид: нюкер/кор (SF, Инвокер, Шторм, Лина, Пак, QoP…)
  h => has(h, "Nuker") && (has(h, "Carry") || has(h, "Escape")) && !(first(h) === "Support" && !has(h, "Carry")),
  // 3 Оффлейн: живучий инициатор (Акс, Марс, Тайд, Андерлорд, Бристл…)
  h => ((has(h, "Durable") || has(h, "Initiator")) && h.primary_attr === "str") ||
       first(h) === "Initiator" || first(h) === "Durable",
  // 4 Семи-сап: саппорт или роумер с контролем (Таск, Шейкер…)
  h => has(h, "Support") || (has(h, "Initiator") && has(h, "Disabler") && !has(h, "Carry") && !has(h, "Durable")),
  // 5 Фулл-сап
  h => has(h, "Support"),
];
const fitsPosition = (h, pos) => LISTED_HEROES.has(h.localized_name)
  ? POSITION_HEROES[pos].has(h.localized_name)
  : POSITION_BY_ROLES[pos](h);
const ROLE_RU = { null: "Любая", Carry: "Керри", Support: "Саппорт", Initiator: "Инициатор",
  Nuker: "Нюкер", Disabler: "Контроль", Durable: "Танк", Pusher: "Пушер", Escape: "Мобильный",
  Jungler: "Лесник" };
const NEEDED_ROLES = ["Carry", "Support", "Initiator", "Disabler"];
const CONSUMABLES = new Set(["tango", "clarity", "flask", "enchanted_mango", "faerie_fire",
  "tpscroll", "ward_observer", "ward_sentry", "ward_dispenser", "dust", "smoke_of_deceit",
  "blood_grenade", "tome_of_knowledge", "cheese", "aegis", "refresher_shard", "famango",
  "great_famango", "greater_famango"]);

/* ================================================================ telegram */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const haptic = (t = "light") => { try { tg && tg.HapticFeedback.impactOccurred(t); } catch (e) {} };

/* ================================================================ данные */
const mem = {};
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

async function api(path, ttl) {
  const now = Date.now();
  const hit = mem[path] || lsGet("od:" + path);
  if (hit && now - hit.t < ttl) return (mem[path] = hit).data;
  try {
    const r = await fetch(API + path);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    mem[path] = { t: now, data };
    lsSet("od:" + path, mem[path]);
    return data;
  } catch (err) {
    if (hit) return hit.data;            // нет сети — отдадим старые данные
    throw err;
  }
}

let HEROES = {}, HERO_LIST = [], ITEMS = null;

async function loadHeroes() {
  const data = await api("/heroStats", STATS_TTL);
  HEROES = {};
  for (const h of data) HEROES[h.id] = h;
  HERO_LIST = data.slice().sort((a, b) => a.localized_name.localeCompare(b.localized_name));
}
async function loadItems() {
  if (ITEMS) return ITEMS;
  const data = await api("/constants/items", CONST_TTL);
  ITEMS = {};
  for (const [key, it] of Object.entries(data)) if (it && it.id != null) ITEMS[it.id] = { ...it, key };
  return ITEMS;
}
const matchups = id => api(`/heroes/${id}/matchups`, BUILD_TTL);
const itemPop = id => api(`/heroes/${id}/itemPopularity`, BUILD_TTL);
const proMatches = id => api(`/heroes/${id}/matches`, 3600e3);

/* ================================================================ утилиты */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Math.round(n).toLocaleString("ru-RU");
const sign = x => (x >= 0 ? "+" : "") + x.toFixed(1);
const heroImg = h => h && h.img ? CDN + h.img : "";
const wrClass = w => w == null ? "" : w >= 52 ? "good" : w <= 48 ? "bad" : "";
function pub(h, brackets = [1, 2, 3, 4, 5, 6, 7, 8]) {
  let p = 0, w = 0;
  for (const b of brackets) { p += h[b + "_pick"] || 0; w += h[b + "_win"] || 0; }
  return { p, w, wr: p ? w / p * 100 : null };
}
const proStat = h => ({ p: h.pro_pick || 0, w: h.pro_win || 0, wr: h.pro_pick ? h.pro_win / h.pro_pick * 100 : null });
const norm = s => s.toLowerCase().replace(/[^a-z0-9а-яё]/g, "");

function tileHTML(h, extra = "") {
  const hi = pub(h, HIGH).wr;
  return `<button class="hero-tile" data-id="${h.id}">
    <img loading="lazy" src="${heroImg(h)}" alt="">
    <div class="nm">${esc(h.localized_name)}</div>
    <div class="wr ${wrClass(hi)}">${hi == null ? "—" : hi.toFixed(1) + "%"}${extra}</div>
  </button>`;
}
function chipsHTML(opts, active) {
  return opts.map(([v, t]) => `<button class="chip ${v === active ? "active" : ""}" data-v="${v}">${t}</button>`).join("");
}

/* ================================================================ навигация */
let currentTab = "draft";
const stack = [];   // история внутри вкладок (карточки героев)

function showView(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + id));
  window.scrollTo(0, 0);
  updateBack();
}
function switchTab(tab) {
  currentTab = tab; stack.length = 0;
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  showView(tab);
}
function updateBack() {
  if (!tg) return;
  const need = stack.length > 0 || $("#picker").classList.contains("open");
  need ? tg.BackButton.show() : tg.BackButton.hide();
}
function goBack() {
  if ($("#picker").classList.contains("open")) return closePicker();
  const prev = stack.pop();
  if (prev == null) return;
  if (typeof prev === "number") openHero(prev, false); else showView(prev);
}
if (tg) tg.BackButton.onClick(goBack);
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { haptic(); switchTab(b.dataset.tab); });

/* ================================================================ герои */
const heroState = { q: "", attr: "", sort: "name" };

function renderHeroes() {
  $("#hero-attrs").innerHTML = chipsHTML([["", "Все"], ...Object.entries(ATTRS)], heroState.attr);
  $("#hero-sort").innerHTML = chipsHTML([["name", "По имени"], ["wr", "По винрейту (Divine+)"], ["pro", "По винрейту (про)"]], heroState.sort);
  const q = norm(heroState.q);
  let list = HERO_LIST.filter(h => (!heroState.attr || h.primary_attr === heroState.attr) && (!q || norm(h.localized_name).includes(q)));
  if (heroState.sort === "wr") list = list.slice().sort((a, b) => (pub(b, HIGH).wr || 0) - (pub(a, HIGH).wr || 0));
  if (heroState.sort === "pro") list = list.slice().sort((a, b) => (proStat(b).p >= MIN_PRO_PICKS ? proStat(b).wr : 0) - (proStat(a).p >= MIN_PRO_PICKS ? proStat(a).wr : 0));
  $("#hero-grid").innerHTML = list.map(h => tileHTML(h)).join("") || `<div class="muted">Ничего не найдено</div>`;
}
$("#hero-search").oninput = e => { heroState.q = e.target.value; renderHeroes(); };
$("#hero-attrs").onclick = e => { const c = e.target.closest(".chip"); if (c) { heroState.attr = c.dataset.v; renderHeroes(); } };
$("#hero-sort").onclick = e => { const c = e.target.closest(".chip"); if (c) { heroState.sort = c.dataset.v; renderHeroes(); } };
$("#hero-grid").onclick = e => { const t = e.target.closest(".hero-tile"); if (t) { haptic(); openHero(+t.dataset.id); } };

// Ответ на угрозу: какой предмет брать на каждой позиции (p — 0..4, h — твой герой).

// бьёт с руки (а не кастер): ловкачи и силовые коры. Инвокеру/Штормe/Тинкеру предметы на атаку не нужны.
// Оффлейнерам (Акс, Марс…) предметы на атаку не советуем, даже если OpenDota пишет им роль Carry.

const ATTR_ITEM = { str: "gauntlets", agi: "slippers", int: "mantle", all: "circlet" };
const ATTR_BRACER = { str: "bracer", agi: "wraith_band", int: "null_talisman", all: "bracer" };

// Старт и ранняя игра — по позиции и типу героя
function laneItems(p, h, spam) {
  const attr = h.primary_attr;
  const start = [
    ["tango", "flask", "branches", "branches", ...(melee(h) ? ["quelling_blade"] : []), ATTR_ITEM[attr]],
    ["tango", "faerie_fire", "branches", "branches", ATTR_ITEM[attr]],
    ["tango", "flask", "branches", ...(melee(h) ? ["quelling_blade"] : []), "ring_of_protection"],
    ["tango", "blood_grenade", "ward_observer", "branches", "branches", "faerie_fire"],
    ["tango", "flask", "ward_observer", "ward_sentry", "clarity", "branches"],
  ][p];
  const boots = p === 0 ? "power_treads"
    : p === 1 ? (attr === "int" ? "arcane_boots" : "power_treads")
    : p === 2 ? (melee(h) ? "phase_boots" : attr === "int" ? "arcane_boots" : "power_treads")
    : p === 3 ? "tranquil_boots" : "arcane_boots";
  const early = [
    [ATTR_BRACER[attr], "magic_wand", boots],
    ["bottle", "magic_wand", boots],
    ["magic_wand", ATTR_BRACER[attr], boots],
    ["magic_wand", "wind_lace", boots],
    ["magic_wand", "wind_lace", boots],
  ][p];
  return { start, early, spamNote: spam.length ? `Волшебная палочка обязательна: ${spam.join(", ")} часто кастуют` : "" };
}

// Анализ драфта: что брать против этих врагов на этой позиции
function draftCounters(p, h) {
  const enemies = picked(draft.e).map(id => HEROES[id]).filter(Boolean);
  const allies = picked(draft.a).map(id => HEROES[id]).filter(Boolean);
  const out = new Map();   // ключ предмета -> { key, reasons: [] }
  const add = (key, reason) => {
    if (!key) return;
    if (!out.has(key)) out.set(key, { key, reasons: [] });
    out.get(key).reasons.push(reason);
  };
  const hits = COUNTERS.map(c => ({ c, who: enemies.filter(e => THREAT_SETS[c.tag].has(e.localized_name)) }))
    .filter(x => x.who.length >= x.c.min)
    .sort((a, b) => b.who.length - a.who.length);
  for (const { c, who } of hits) add(c.item(p, h), `${c.why}: ${who.map(e => e.localized_name).join(", ")}`);
  // союзники: если в команде некому начинать драки — инициатором будешь ты
  if ((p === 2 || p === 3) && allies.length >= 2 && !allies.some(a => has(a, "Initiator")))
    add("blink", "в твоей команде нет инициатора — начинать драки придётся тебе");
  const spam = enemies.filter(e => THREAT_SETS.spam.has(e.localized_name)).map(e => e.localized_name);
  return { list: [...out.values()].slice(0, 6), enemies, spam };
}

// эти предметы — части других, но их часто берут как готовые
const CORE_OK_PARTS = new Set(["blink", "force_staff", "aether_lens", "orchid", "dragon_lance", "diffusal_blade"]);
const ITEM_BY_KEY = () => Object.fromEntries(Object.values(ITEMS).map(it => [it.key, it]));
function buildItemsHTML(keys, byKey) {
  return `<div class="items">${keys.map(k => byKey[k]).filter(Boolean).map(it => `<div class="item" title="${esc(it.dname)}">
    <img loading="lazy" src="${it.img ? CDN + it.img : ""}" alt="">${esc(it.dname)}</div>`).join("")}</div>`;
}

function draftBuildHTML(h, pop) {
  const byKey = ITEM_BY_KEY();
  const myFits = fitsPosition(h, draft.me);
  const p = myFits ? draft.me : ([0, 1, 2, 3, 4].find(i => fitsPosition(h, i)) ?? draft.me);
  const { list, enemies, spam } = draftCounters(p, h);
  const lane = laneItems(p, h, spam);
  const used = new Set([...lane.start, ...lane.early, ...list.map(x => x.key)]);
  // основа — готовые предметы, которые этот герой обычно собирает (без того, что уже есть выше)
  const parts = new Set(Object.values(ITEMS).flatMap(it => it.components || []));
  const merged = { ...(pop.late_game_items || {}) };
  for (const [k, n] of Object.entries(pop.mid_game_items || {})) merged[k] = (merged[k] || 0) + n;
  const core = Object.entries(merged).sort((a, b) => b[1] - a[1]).map(([id]) => ITEMS[id]).filter(Boolean)
    .filter(it => (it.cost || 0) >= 2000 && (!parts.has(it.key) || CORE_OK_PARTS.has(it.key)) &&
      !CONSUMABLES.has(it.key) && !/recipe_|boots|treads|travel/.test(it.key) && !used.has(it.key))
    .slice(0, 6)
    // не показываем предмет, если рядом уже есть его улучшение (Blink + Swift Blink)
    .filter((it, _, all) => !all.some(o => (o.components || []).includes(it.key)))
    .map(it => it.key).slice(0, 3);

  const counters = enemies.length
    ? (list.length ? list.map(x => {
        const it = byKey[x.key];
        return `<div class="ctr"><img loading="lazy" src="${it && it.img ? CDN + it.img : ""}" alt="">
          <div><b>${esc(it ? it.dname : x.key)}</b><div class="why">${x.reasons.map(esc).join("<br>")}</div></div></div>`;
      }).join("") : `<div class="muted">Против этих врагов ничего особого не нужно — собирай основу.</div>`)
    : `<div class="muted">Добавь врагов в драфте — подберу предметы против них.</div>`;

  return `
    <h2>🧠 Билд под драфт · ${p + 1} · ${POSITIONS[p]}</h2>
    ${myFits ? "" : `<p class="muted" style="margin-top:0">На твою позицию (${draft.me + 1} · ${POSITIONS[draft.me]}) этот герой обычно не ходит, поэтому билд для ${p + 1} · ${POSITIONS[p]}.</p>`}
    <div class="card build">
      <div class="st">🛒 Старт</div>${buildItemsHTML(lane.start, byKey)}
      <div class="st">⏱ Ранняя игра</div>${buildItemsHTML(lane.early, byKey)}
      ${lane.spamNote ? `<div class="why">${esc(lane.spamNote)}</div>` : ""}
      ${core.length ? `<div class="st">⚔️ Основа героя</div>${buildItemsHTML(core, byKey)}` : ""}
      <div class="st">🎯 Против этого драфта</div>${counters}
    </div>`;
}

/* ================================================================ карточка героя */
function pickItems(stage, late) {
  return Object.entries(stage || {}).sort((a, b) => b[1] - a[1]).map(([id, n]) => [ITEMS[id], n])
    .filter(([it]) => it && !it.key.startsWith("recipe_") &&
      (!late || (!CONSUMABLES.has(it.key) && (it.components || (it.cost || 0) >= 2000))))
    .slice(0, TOP_ITEMS);
}
function itemsHTML(list) {
  if (!list.length) return `<div class="muted">Нет данных</div>`;
  return `<div class="items">${list.map(([it, n]) => `<div class="item" title="${esc(it.dname || it.key)}">
    <img loading="lazy" src="${it.img ? CDN + it.img : ""}" alt="">${esc(it.dname || it.key)}<br><b>${n}</b></div>`).join("")}</div>`;
}
function muHTML(rows) {
  return `<div class="mu">${rows.map(r => `<button class="mu-row" data-id="${r.h.id}">
    <img loading="lazy" src="${heroImg(r.h)}" alt=""><span class="nm">${esc(r.h.localized_name)}</span>
    <span class="val ${wrClass(r.wr)}">${r.wr.toFixed(0)}%</span><span class="g">${r.g} игр</span></button>`).join("")}</div>`;
}

function ago(ts) {
  const s = Date.now() / 1000 - ts;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " мин назад";
  if (s < 86400) return Math.round(s / 3600) + " ч назад";
  return Math.round(s / 86400) + " дн назад";
}
function matchesHTML(list) {
  return list.map(m => {
    const won = m.radiant === m.radiant_win;
    const dur = Math.floor(m.duration / 60) + ":" + String(m.duration % 60).padStart(2, "0");
    return `<button class="match-row" data-mid="${m.match_id}">
      <span class="res ${won ? "good" : "bad"}">${won ? "Победа" : "Поражение"}</span>
      <span class="mid"><span>${esc(m.league_name || "Про-матч")}</span>
        <span class="muted">${ago(m.start_time)} · ${dur}</span></span>
      <span class="kda">${m.kills}/${m.deaths}/${m.assists}</span></button>`;
  }).join("");
}

async function openHero(id, push = true) {
  const h = HEROES[id];
  if (!h) return;
  if (push) {
    const cur = document.querySelector(".view.active").id.replace("view-", "");
    stack.push(cur === "hero" ? currentHeroId : cur);
  }
  currentHeroId = id;
  const v = $("#view-hero");
  const pro = proStat(h), all = pub(h), hi = pub(h, HIGH);
  const roles = (h.roles || []).map(r => ROLE_RU[r] || r).join(" · ");
  const stat = (val, label, games) => `<div class="card stat"><div class="v ${wrClass(val)}">${val == null ? "—" : val.toFixed(1) + "%"}</div>
    <div class="l">${label}${games ? " · " + fmt(games) + " игр" : ""}</div></div>`;
  v.innerHTML = `
    <div class="hero-head"><img src="${heroImg(h)}" alt="">
      <div class="over"><div class="t">${esc(h.localized_name)}</div><div class="s">${ATTRS[h.primary_attr] || ""} · ${esc(roles)}</div></div></div>
    <div id="hero-draft-build"><div class="loading">Собираю билд под драфт…</div></div>
    <h2>📈 Статистика</h2>
    <div class="stats">
      ${stat(pro.wr, "Про-сцена", pro.p)}
      ${stat(hi.wr, "Divine + Immortal", hi.p)}
      ${stat(all.wr, "Паблик, все ранги", all.p)}
      <div class="card stat"><div class="v">${fmt(h.pro_ban || 0)}</div><div class="l">Банов в про</div></div>
    </div>
    <div id="hero-build"><div class="loading">Загружаю закупы…</div></div>`;
  showView("hero");

  try {
    const [pop, mu, , pm] = await Promise.all([itemPop(id), matchups(id), loadItems(), proMatches(id).catch(() => [])]);
    if (currentHeroId !== id) return;
    const rows = mu.filter(m => m.games_played >= MIN_MATCHUP_GAMES && HEROES[m.hero_id])
      .map(m => ({ h: HEROES[m.hero_id], wr: m.wins / m.games_played * 100, g: m.games_played }))
      .sort((a, b) => a.wr - b.wr);
    $("#hero-draft-build").innerHTML = draftBuildHTML(h, pop);
    $("#hero-build").innerHTML = `
      <details class="pro-items"><summary>📊 Что покупают про-игроки</summary>
        <h2>🛒 Стартовый закуп</h2><div class="card">${itemsHTML(pickItems(pop.start_game_items, false))}</div>
        <h2>⏱ Ранняя игра</h2><div class="card">${itemsHTML(pickItems(pop.early_game_items, false))}</div>
        <h2>⚔️ Мид-гейм</h2><div class="card">${itemsHTML(pickItems(pop.mid_game_items, true))}</div>
        <h2>👑 Лейт</h2><div class="card">${itemsHTML(pickItems(pop.late_game_items, true))}</div>
        <p class="muted">Под предметами — число про-матчей, в которых их покупали. Данные: OpenDota.</p>
      </details>
      ${rows.some(r => r.wr < 50) ? `<h2>😣 Тяжело против</h2><div class="card">${muHTML(rows.filter(r => r.wr < 50).slice(0, 5))}</div>` : ""}
      ${rows.some(r => r.wr > 50) ? `<h2>😎 Хорош против</h2><div class="card">${muHTML(rows.filter(r => r.wr > 50).reverse().slice(0, 5))}</div>` : ""}
      ${pm.length ? `<h2>🎮 Последние про-матчи</h2><div class="card">${matchesHTML(pm.slice(0, 10))}</div>` : ""}`;
  } catch (e) {
    if (currentHeroId === id) {
      $("#hero-draft-build").innerHTML = "";
      $("#hero-build").innerHTML = `<div class="error">Не удалось загрузить закупы. Попробуй позже.</div>`;
    }
  }
}
let currentHeroId = null;
$("#view-hero").onclick = e => {
  const r = e.target.closest(".mu-row");
  if (r) { haptic(); return openHero(+r.dataset.id); }
  const m = e.target.closest(".match-row");
  if (m) {
    const url = "https://www.opendota.com/matches/" + m.dataset.mid;
    haptic();
    tg && tg.openLink ? tg.openLink(url) : window.open(url, "_blank");
  }
};

/* ================================================================ топ */
let topMode = "pub";
function renderTop() {
  $("#top-mode").innerHTML = chipsHTML([["pub", "🔥 Паблик Divine+"], ["all", "👥 Паблик, все"], ["pro", "🏆 Про-сцена"]], topMode);
  const get = topMode === "pro" ? proStat : topMode === "all" ? (h => pub(h)) : (h => pub(h, HIGH));
  const min = topMode === "pro" ? MIN_PRO_PICKS : MIN_PUB_PICKS;
  const rows = HERO_LIST.map(h => ({ h, ...get(h) })).filter(r => r.p >= min)
    .sort((a, b) => b.wr - a.wr).slice(0, TOP_SIZE);
  const max = rows.length ? rows[0].wr : 100;
  $("#top-list").innerHTML = rows.map((r, i) => `<button class="top-row" data-id="${r.h.id}">
    <span class="rk">${i + 1}</span><img loading="lazy" src="${heroImg(r.h)}" alt="">
    <div class="mid"><div>${esc(r.h.localized_name)}</div>
      <div class="bar"><i style="width:${Math.max(5, (r.wr - 40) / (max - 40) * 100)}%"></i></div></div>
    <div style="text-align:right"><b class="${wrClass(r.wr)}">${r.wr.toFixed(1)}%</b><div class="muted" style="font-size:11px">${fmt(r.p)} игр</div></div>
  </button>`).join("") || `<div class="muted">Недостаточно данных</div>`;
  $("#top-note").textContent = `В топ попадают герои минимум с ${fmt(min)} играми.`;
}
$("#top-mode").onclick = e => { const c = e.target.closest(".chip"); if (c) { topMode = c.dataset.v; renderTop(); } };
$("#top-list").onclick = e => { const r = e.target.closest(".top-row"); if (r) { haptic(); openHero(+r.dataset.id); } };

/* ================================================================ драфт */
const emptyDraft = () => ({ a: Array(TEAM_SIZE).fill(null), e: Array(TEAM_SIZE).fill(null), me: 0 });
let draft = lsGet("draft") || emptyDraft();
const saveDraft = () => lsSet("draft", draft);
const picked = arr => arr.filter(id => id != null);   // герои без пустых позиций
// свободные позиции в своей команде (не твоя и без героя)
// свободные позиции команды: без героя (и в своей команде — не твоя)
const freePositions = side => draft[side].map((id, i) => id == null && !(side === "a" && i === draft.me) ? i : -1).filter(i => i >= 0);

// приводит драфт к виду «5 позиций у каждой команды» (в т.ч. старый формат без позиций)
function normDraft(d) {
  const fix = arr => Array.from({ length: TEAM_SIZE }, (_, i) => arr && arr[i] != null && HEROES[arr[i]] ? arr[i] : null);
  if (d.me == null) d = { ...d, me: 0, a: [null, ...(d.a || [])] };
  const me = Math.min(Math.max(+d.me || 0, 0), TEAM_SIZE - 1);
  const a = fix(d.a); a[me] = null;
  return { a, e: fix(d.e), me };
}

function slotHTML(side, id, idx) {
  const h = id != null && HEROES[id];
  const role = `<span class="role">${idx + 1} · ${POSITIONS[idx]}</span>`;
  if (h) return `<button class="slot ${side === "a" ? "ally" : "enemy"} filled" data-side="${side}" data-idx="${idx}" data-id="${id}">
    <img src="${heroImg(h)}" alt=""><span class="x">✕</span>${role}</button>`;
  return `<button class="slot empty" data-side="${side}" data-idx="${idx}" data-add="1">
    <span class="num">${idx + 1}</span><span class="role">${POSITIONS[idx]}</span></button>`;
}
function renderDraft() {
  $("#ally-slots").innerHTML = draft.a.map((id, i) => i === draft.me
    ? `<div class="slot me"><span class="num">Ты</span><span class="role">${i + 1} · ${POSITIONS[i]}</span></div>`
    : slotHTML("a", id, i)).join("");
  $("#enemy-slots").innerHTML = draft.e.map((id, i) => slotHTML("e", id, i)).join("");
  $("#add-ally").hidden = !freePositions("a").length;
  $("#add-enemy").hidden = !freePositions("e").length;
  $("#recs-title").textContent = `✅ Советую взять на ${draft.me + 1} · ${POSITIONS[draft.me]}`;
  renderRecs();
}

let recsToken = 0;
async function renderRecs() {
  const token = ++recsToken;
  const box = $("#recs");
  box.innerHTML = `<div class="loading">Считаю…</div>`;
  try {
    const allies = picked(draft.a), enemies = picked(draft.e);
    const tables = await Promise.all(enemies.map(async e => {
      const t = {};
      for (const m of await matchups(e)) t[m.hero_id] = m;
      return t;
    }));
    if (token !== recsToken) return;
    const taken = new Set([...allies, ...enemies]);
    const recs = [];
    for (const h of HERO_LIST) {
      if (taken.has(h.id)) continue;
      if (!fitsPosition(h, draft.me)) continue;   // советуем только героев под твою позицию
      // если враг E часто проигрывает герою X — X хорош против E
      const parts = enemies.map((e, i) => {
        const m = tables[i][h.id] || { wins: 0, games_played: 0 };
        const enemyWr = (m.wins + DRAFT_PRIOR * 0.5) / (m.games_played + DRAFT_PRIOR);
        return { e, v: (0.5 - enemyWr) * 100 };
      });
      const hi = pub(h, HIGH);
      const meta = hi.p >= MIN_PUB_PICKS ? (hi.wr - 50) * META_WEIGHT : 0;
      recs.push({ h, parts, meta, score: parts.reduce((s, p) => s + p.v, 0) + meta });
    }
    recs.sort((a, b) => b.score - a.score);

    let html = "";
    if (!enemies.length) html += `<p class="muted" style="margin-top:0">Добавь врагов, чтобы получить контрпики. Пока советую по силе героя в текущей мете.</p>`;
    html += recs.slice(0, DRAFT_TOP).map(r => {
      const det = r.parts.slice().sort((a, b) => b.v - a.v).slice(0, 3)
        .map(p => `${esc(HEROES[p.e].localized_name)} <span class="${p.v >= 0 ? "good" : "bad"}">${sign(p.v)}</span>`);
      det.push(`мета <span class="${r.meta >= 0 ? "good" : "bad"}">${sign(r.meta)}</span>`);
      return `<button class="rec" data-id="${r.h.id}"><img loading="lazy" src="${heroImg(r.h)}" alt="">
        <div class="mid"><div class="nm">${esc(r.h.localized_name)}</div><div class="det">${det.join(" · ")}</div></div>
        <div class="sc ${r.score >= 0 ? "good" : "bad"}">${sign(r.score)}</div></button>`;
    }).join("") || `<div class="muted">Нет подходящих героев, попробуй другую роль.</div>`;

    if (allies.length >= 2) {
      const missing = NEEDED_ROLES.filter(r => !allies.some(a => (HEROES[a].roles || []).includes(r)));
      if (missing.length) html += `<div class="warn">⚠️ В команде нет: <b>${missing.map(r => ROLE_RU[r].toLowerCase()).join(", ")}</b>. Учти это при пике.</div>`;
    }
    html += `<p class="muted" style="margin-bottom:0">👆 Нажми на героя — покажу билд под этот драфт.<br>Оценка: преимущество против каждого врага в про-матчах (п.п. винрейта) + текущая сила героя на Divine+.</p>`;
    box.innerHTML = html;
  } catch (e) {
    if (token === recsToken) box.innerHTML = `<div class="error">Не удалось загрузить данные. Проверь интернет и попробуй ещё раз.</div>`;
  }
}

$("#ally-slots").onclick = $("#enemy-slots").onclick = e => {
  const s = e.target.closest(".slot[data-side]");
  if (!s) return;
  haptic();
  const side = s.dataset.side, idx = +s.dataset.idx;
  if (side === "a") {
    if (s.dataset.id && e.target.closest(".x")) { draft.a[idx] = null; }          // ✕ — убрать союзника
    else {
      // нажатие на позицию: ты встаёшь на неё, союзник с неё — на твою прежнюю
      draft.a[draft.me] = draft.a[idx];
      draft.a[idx] = null;
      draft.me = idx;
    }
    saveDraft(); renderDraft();
    return;
  }
  if (s.dataset.add) return openPicker(side, idx);
  draft[side][idx] = null;
  saveDraft(); renderDraft();
};
$("#recs").onclick = e => { const r = e.target.closest(".rec"); if (r) { haptic(); openHero(+r.dataset.id); } };
$("#draft-reset").onclick = () => { haptic("medium"); draft = { ...emptyDraft(), me: draft.me }; saveDraft(); renderDraft(); };

/* ================================================================ выбор героя */
const picker = { side: "a", idx: 0, q: "", attr: "" };
function renderPickerPos() {
  $("#picker-pos").innerHTML = freePositions(picker.side).map(i =>
    `<button class="chip ${i === picker.idx ? "active" : ""}" data-v="${i}">${i + 1} · ${POSITIONS[i]}</button>`).join("");
}
function openPicker(side, idx) {
  picker.side = side; picker.idx = idx; picker.q = ""; picker.attr = "";
  $("#picker-search").value = "";
  $("#picker-title").textContent = side === "a" ? "🟢 Добавить союзника" : "🔴 Добавить врага";
  $("#picker-pos-wrap").hidden = false;
  renderPickerPos();
  renderPicker();
  $("#picker").classList.add("open");
  updateBack();
}
function closePicker() { $("#picker").classList.remove("open"); updateBack(); }
function renderPicker() {
  $("#picker-attrs").innerHTML = chipsHTML([["", "Все"], ...Object.entries(ATTRS)], picker.attr);
  const taken = new Set([...picked(draft.a), ...picked(draft.e)]);
  const q = norm(picker.q);
  $("#picker-grid").innerHTML = HERO_LIST.filter(h => !taken.has(h.id) &&
    (!picker.attr || h.primary_attr === picker.attr) && (!q || norm(h.localized_name).includes(q)))
    .map(h => tileHTML(h)).join("") || `<div class="muted">Ничего не найдено</div>`;
}
$("#picker-search").oninput = e => { picker.q = e.target.value; renderPicker(); };
$("#picker-attrs").onclick = e => { const c = e.target.closest(".chip"); if (c) { picker.attr = c.dataset.v; renderPicker(); } };
$("#picker-close").onclick = closePicker;
$("#picker-pos").onclick = e => { const c = e.target.closest(".chip"); if (c) { haptic(); picker.idx = +c.dataset.v; renderPickerPos(); } };
$("#add-ally").onclick = $("#add-enemy").onclick = e => {
  const side = e.currentTarget.id === "add-ally" ? "a" : "e";
  const free = freePositions(side);
  if (!free.length) return;
  haptic();
  openPicker(side, free[0]);
};
$("#picker-grid").onclick = e => {
  const t = e.target.closest(".hero-tile");
  if (!t) return;
  const id = +t.dataset.id, side = picker.side;
  if (!draft.a.includes(id) && !draft.e.includes(id)) draft[side][picker.idx] = id;
  try { tg && tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  saveDraft(); closePicker(); renderDraft();
};

/* ================================================================ старт */
(async function init() {
  try {
    await loadHeroes();
    draft = normDraft(draft); saveDraft();
    renderDraft(); renderHeroes(); renderTop();
  } catch (e) {
    const msg = `<div class="error">Не удалось загрузить данные с OpenDota.<br>Проверь интернет и открой приложение заново.</div>`;
    $("#recs").innerHTML = msg; $("#hero-grid").innerHTML = msg; $("#top-list").innerHTML = msg;
  }
})();
</script>
</body>
</html>
